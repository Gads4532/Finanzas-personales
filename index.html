<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanzas en Claro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --bg: #ffffff; --text: #111111; --muted: #8a8a8a; --line: #ededed; --empty: #e6e6e6;
    --green: #1f9d55; --red: #d64545; --warn: #b7791f;
    --accent: #12a150; --accent-dark: #0c7a3c;
    /* Resortes reales (masa 1): bouncy k=180 c=10 · pop k=300 c=14 · soft k=120 c=14 */
    --spring-bouncy: linear(0, 0.067, 0.237, 0.462, 0.699, 0.916, 1.089, 1.208, 1.27, 1.282, 1.255, 1.202, 1.137, 1.07, 1.011, 0.966, 0.936, 0.922, 0.921, 0.931, 0.947, 0.966, 0.984, 1, 1.012, 1.02, 1.023, 1.022, 1.019, 1.014, 1.008, 1.003, 0.999, 0.996, 0.994, 0.994, 0.994, 0.995, 0.996, 0.998, 0.999, 1.001, 1.001, 1.002, 1.002, 1.002, 1.001, 1.001, 1);
    --spring-pop: linear(0, 0.057, 0.203, 0.399, 0.612, 0.813, 0.985, 1.115, 1.201, 1.243, 1.248, 1.224, 1.183, 1.131, 1.078, 1.03, 0.991, 0.962, 0.945, 0.938, 0.94, 0.947, 0.959, 0.972, 0.985, 0.996, 1.005, 1.011, 1.015, 1.016, 1.015, 1.012, 1.009, 1.006, 1.003, 1, 0.998, 0.997, 0.996, 0.996, 0.997, 0.997, 0.998, 0.999, 1, 1, 1.001, 1.001, 1);
    --spring-soft: linear(0, 0.023, 0.083, 0.168, 0.269, 0.376, 0.484, 0.588, 0.684, 0.769, 0.844, 0.906, 0.957, 0.998, 1.028, 1.049, 1.063, 1.071, 1.074, 1.072, 1.068, 1.062, 1.055, 1.047, 1.039, 1.031, 1.024, 1.018, 1.012, 1.007, 1.004, 1.001, 0.998, 0.997, 0.995, 0.995, 0.995, 0.995, 0.995, 0.995, 0.996, 0.996, 0.997, 0.998, 0.998, 0.999, 0.999, 0.999, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e0e; --text: #f2f2f2; --muted: #7a7a7a; --line: #1f1f1f; --empty: #2a2a2a;
      --green: #3fbf75; --red: #ef6a6a; --warn: #d9a441; --accent: #2bbf6a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0e0e; --text: #f2f2f2; --muted: #7a7a7a; --line: #1f1f1f; --empty: #2a2a2a;
    --green: #3fbf75; --red: #ef6a6a; --warn: #d9a441; --accent: #2bbf6a; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { overflow-x: hidden; max-width: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font);
    -webkit-font-smoothing: antialiased; overscroll-behavior-x: none; }
  main { max-width: 520px; margin: 0 auto; padding-block: 48px 130px; overflow-x: clip;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .top > div { min-width: 0; }
  .global { flex: none; }
  .global { text-align: right; }
  .g-rate { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; font-size: 1.15rem; font-weight: 600;
    font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .g-sub { color: var(--muted); font-size: .8rem; }
  h1 { font-size: 2rem; font-weight: 600; letter-spacing: -.02em; margin: 0; }
  .date { color: var(--muted); margin: 2px 0 28px; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { cursor: default; }
  .link { color: var(--muted); font-size: .9rem; }
  .link:hover { color: var(--text); }
  .note { color: var(--muted); font-size: .9rem; margin: 0 0 24px; }
  .num { font-variant-numeric: tabular-nums; }

  /* Saldo total */
  .hero { margin-bottom: 26px; }
  .hero-label { color: var(--muted); font-size: .85rem; }
  .hero-total { display: block; font-size: clamp(1.8rem, 10vw, 2.6rem); font-weight: 700; letter-spacing: -.035em; line-height: 1.1;
    font-variant-numeric: tabular-nums; text-align: left; }
  .hero-alt { color: var(--muted); font-size: .95rem; font-variant-numeric: tabular-nums; }
  .quick { display: flex; align-items: center; gap: 10px; border: 1.5px solid var(--line); border-radius: 999px;
    padding: 4px 6px 4px 16px; margin-bottom: 30px; }
  .quick:focus-within { border-color: var(--text); }
  .quick input { border: 0; padding: 8px 0; flex: 1; min-width: 0; }
  .round { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .round svg { width: 20px; height: 20px; }
  .round.go { background: var(--text); color: var(--bg); }
  .round.rec { background: var(--red); color: #fff; }

  .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; border-top: 1px solid var(--line); padding-top: 18px; margin-bottom: 30px; }
  .summary > div:last-child { text-align: right; } .summary > div:nth-child(2) { text-align: center; }
  .summary b { display: block; white-space: nowrap; font-size: clamp(.9rem, 4.2vw, 1.25rem); font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .summary span { color: var(--muted); font-size: .8rem; }
  .pos { color: var(--green); } .neg { color: var(--red); }

  h2.sec { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    margin: 30px 0 4px; display: flex; justify-content: space-between; align-items: baseline; }
  h2.sec .link { text-transform: none; letter-spacing: 0; font-weight: 400; }

  /* Filas: misma pieza que los hábitos */
  .item { border-top: 1px solid var(--line); padding: 14px 0; --c: var(--text); }
  .list > .item:last-child { border-bottom: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 14px; }
  .dot { flex: none; position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--c);
    color: var(--c); display: grid; place-items: center; }
  .dot svg { width: 20px; height: 20px; }
  .dot.fill { background: var(--c); color: var(--bg); }
  .dot.ring { border: 0; }
  .dot .prog { position: absolute; inset: 0; width: 40px; height: 40px; transform: rotate(-90deg); }
  .title { flex: 1; min-width: 0; text-align: left; }
  .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; white-space: nowrap; }
  .amt small { display: block; color: var(--muted); font-weight: 400; font-size: .78rem; }
  .amt.in { color: var(--green); }
  .amt.neg { color: var(--red); }
  .detail { margin: 14px 0 0 54px; }
  .meta { font-size: .9rem; color: var(--muted); margin: 0 0 4px; }
  .meta b { color: var(--text); font-weight: 500; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; white-space: nowrap; }
  .mini { list-style: none; padding: 0; margin: 8px 0 0; font-size: .9rem; }
  .mini li { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; color: var(--muted); }
  .mini li b { font-weight: 500; color: var(--text); font-variant-numeric: tabular-nums; }
  .pay { flex: none; padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--text); font-size: .85rem; font-weight: 500; }
  .pay:active { background: var(--text); color: var(--bg); }
  .due { color: var(--warn); }
  .late { color: var(--red); }

  .bar { height: 6px; border-radius: 999px; background: var(--empty); overflow: hidden; margin-top: 8px; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: var(--c); width: var(--w); transform-origin: left; }
  .bar.warn i { background: var(--warn); } .bar.over i { background: var(--red); }

  .empty { color: var(--muted); padding: 20px 0; }
  .adds { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 22px; }
  .add { font-weight: 500; }
  .outline { display: block; margin-top: 24px; padding: 11px 18px; border-radius: 999px; border: 1.5px solid var(--text); font-weight: 500; }
  .outline:active { background: var(--text); color: var(--bg); }
  .backup { display: flex; flex-wrap: wrap; gap: 12px 20px; margin-top: 24px; }
  .ver { color: var(--muted); font-size: .8rem; margin-top: 16px; display: flex; gap: 16px; align-items: center; }
  .field { margin-top: 14px; }
  .upd { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; margin: 0 0 20px;
    border: 1.5px solid var(--line); border-radius: 12px; font-size: .9rem; }
  .upd .primary { padding: 7px 14px; }

  /* Movimientos */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 18px; scrollbar-width: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px;
    border: 1.5px solid var(--line); color: var(--muted); font-size: .88rem; white-space: nowrap; --c: var(--text); }
  .chip svg { width: 16px; height: 16px; }
  .chip.on { border-color: var(--c); color: var(--text); }
  .chip.on svg { color: var(--c); }
  .month { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .month h2 { font-size: 1.15rem; font-weight: 600; margin: 0; }
  .month button { width: 36px; height: 36px; border-radius: 50%; font-size: 1.3rem; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px 6px; text-align: center; margin-bottom: 8px; }
  .wd { font-size: .72rem; color: var(--muted); padding-bottom: 4px; }
  .day { aspect-ratio: 1; width: 100%; max-width: 44px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center;
    font-size: .88rem; font-variant-numeric: tabular-nums; color: var(--muted);
    background: color-mix(in srgb, var(--red) calc(var(--h, 0) * 85%), transparent); }
  .day.has { color: var(--text); font-weight: 600; }
  .day.hot { color: #fff; }
  .day.inc::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--green); position: absolute; bottom: 2px; left: calc(50% - 2.5px); }
  .day { position: relative; }
  .day.today { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--text); color: var(--text); }
  .day.sel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--accent); }
  .day.future { opacity: .45; }
  .search { margin: 8px 0 6px; }
  .dayhead { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; margin: 22px 0 2px; }
  .dayhead span::first-letter { text-transform: uppercase; }
  .dayhead b { font-weight: 500; font-variant-numeric: tabular-nums; }
  .compare { font-size: .85rem; color: var(--muted); margin: -16px 0 24px; }
  .compare b { font-weight: 600; }

  /* Diálogos */
  dialog { border: 0; padding: 28px 24px; width: min(480px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
    background: var(--bg); color: var(--text); border-radius: 14px; }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h2 { font-size: 1.3rem; font-weight: 600; margin: 0 0 8px; letter-spacing: -.01em; }
  label { display: block; margin: 18px 0 2px; font-size: .8rem; color: var(--muted); }
  input, textarea, select { width: 100%; font: inherit; padding: 6px 0; border: 0; border-bottom: 1px solid var(--line);
    background: none; color: var(--text); border-radius: 0; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--text); }
  select { background: var(--bg); }
  option { background: var(--bg); color: var(--text); }
  .big-input { display: flex; align-items: baseline; gap: 8px; }
  .big-input input { font-size: 2rem; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .big-input span { color: var(--muted); font-size: 1.1rem; }
  .hint { color: var(--muted); font-size: .8rem; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .two { display: flex; gap: 16px; } .two > div { flex: 1; min-width: 0; }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; overflow: hidden; margin-top: 4px; }
  .seg label { margin: 0; padding: 6px 16px; font-size: .85rem; color: var(--muted); cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; width: auto; }
  .seg label:has(input:checked) { background: var(--text); color: var(--bg); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--muted); outline-offset: -2px; }
  .dialog-actions { display: flex; justify-content: flex-end; align-items: center; gap: 24px; margin-top: 28px; }
  .dialog-actions .danger { color: var(--red); margin-right: auto; }
  .primary { background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 500; }
  .picker { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .picker label { display: block; margin: 0; }
  .picker input { position: absolute; opacity: 0; pointer-events: none; width: auto; }
  .icon-pick { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
    color: var(--muted); border: 1.5px solid transparent; cursor: pointer; }
  .icon-pick svg { width: 20px; height: 20px; }
  input:checked + .icon-pick { color: var(--c); border-color: var(--c); }
  .swatch { display: block; width: 28px; height: 28px; border-radius: 50%; background: var(--sw); cursor: pointer; border: 2px solid transparent; }
  input:checked + .swatch { border: 2px solid var(--sw); box-shadow: inset 0 0 0 3px var(--bg); }
  .catpick .chip { cursor: pointer; }
  input:checked + .chip { border-color: var(--c); color: var(--text); }
  input:checked + .chip svg { color: var(--c); }
  input:focus-visible + .icon-pick, input:focus-visible + .swatch, input:focus-visible + .chip { outline: 2px solid var(--muted); outline-offset: 2px; }
  #form { --c: var(--text); }

  /* Botón + flotante y aviso con deshacer */
  .fab { position: fixed; z-index: 6; right: max(20px, calc(50vw - 240px)); bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    width: 52px; height: 52px; border-radius: 50%; background: var(--text); color: var(--bg); display: grid; place-items: center; }
  .fab svg { width: 24px; height: 24px; }
  .fab:active { transform: scale(.92); }
  .filters { display: flex; align-items: center; gap: 6px; margin: 4px 0 8px; }
  .filters .seg { margin: 0 auto 0 0; }
  .seg button { padding: 6px 14px; font-size: .85rem; color: var(--muted); }
  .seg button.on { background: var(--text); color: var(--bg); }
  .round.on { color: var(--text); background: var(--empty); }
  .more { color: var(--muted); font-size: .85rem; margin: 10px 0 0; line-height: 1.9; }
  .more .link { font-size: inherit; }
  .toast { position: fixed; z-index: 7; left: 50%; max-width: calc(100vw - 32px); bottom: calc(146px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    width: min(488px, calc(100vw - 32px)); background: var(--text); color: var(--bg); border-radius: 14px; padding: 12px 16px;
    display: flex; align-items: center; gap: 16px; font-size: .92rem; }
  .toast span { flex: 1; min-width: 0; }
  .toast button { font-weight: 600; }

  /* Barra inferior */
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: clamp(4px, 5vw, 28px);
    padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); border-top: 1px solid var(--line); z-index: 5; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .72rem; color: var(--muted); min-width: 0; flex: 0 1 72px; white-space: nowrap; }
  .tab svg { width: 22px; height: 22px; }
  .tab.on { color: var(--text); }

  /* Celebración de meta cumplida */
  .cele { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; justify-content: center;
    align-items: center; overflow-y: auto; text-align: center;
    padding-block: calc(24px + env(safe-area-inset-top, 0px)) calc(24px + env(safe-area-inset-bottom, 0px));
    padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .cele-inner { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; margin: auto; }
  .cele-canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cele-coin { position: relative; width: 120px; height: 120px; border-radius: 50%; background: var(--accent); color: #fff;
    display: grid; place-items: center; box-shadow: 0 6px 0 var(--accent-dark); }
  .cele-coin svg { width: 60px; height: 60px; }
  .cele-big { font-size: 3rem; font-weight: 800; color: var(--accent); letter-spacing: -.04em; margin: 22px 0 0; line-height: 1.1;
    font-variant-numeric: tabular-nums; }
  .cele-label { font-size: 1.15rem; font-weight: 700; color: var(--accent); margin: 6px 0 22px; }
  .motivation { font-size: 1.15rem; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }
  .cele-go { margin-top: 28px; width: 100%; padding: 15px; border-radius: 16px; background: var(--accent); color: #fff;
    font-weight: 700; letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 4px 0 var(--accent-dark); }
  .cele-go:active { transform: translateY(4px); box-shadow: none; }

  @media (prefers-reduced-motion: no-preference) {
    dialog[open] { animation: rise .38s cubic-bezier(.2, .9, .3, 1.25); }
    dialog[open]::backdrop { animation: fade .25s ease; }
    .detail { animation: slide .28s ease both; }
    .pop .dot { animation: pop-spring .9s var(--spring-pop); }
    .pop .amt { animation: bump-spring .9s var(--spring-pop) .1s; }
    .hero-total.bump { animation: bump-spring .9s var(--spring-pop); }
    .bar i { animation: grow .9s var(--spring-soft) both; }
    .toast { animation: rise-spring .6s var(--spring-pop); }
    .fab { transition: transform .1s; }
    .day { animation: day-in .35s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(var(--i) * 12ms); }
    .cele { animation: fade .2s ease; }
    .cele.out { animation: fade .2s ease reverse forwards; }
    .cele-coin { animation: coin-in 1.2s var(--spring-bouncy) both; }
    .cele-big { animation: rise-spring .9s var(--spring-soft) .3s both; }
    .cele-label { animation: rise-spring .9s var(--spring-soft) .4s both; }
    .motivation, .cele-inner > .meta, .cele-go { animation: rise-spring .9s var(--spring-soft) .6s both; }
    @keyframes coin-in { from { transform: scale(.3) rotateY(540deg); opacity: 0; } }
    @keyframes pop-spring { from { transform: scale(.6); } to { transform: scale(1); } }
    @keyframes bump-spring { from { transform: scale(1.15); } to { transform: scale(1); } }
    @keyframes rise-spring { from { transform: translate(var(--tx, 0), 18px); opacity: 0; } }
    @keyframes grow { from { transform: scaleX(0); } }
    @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.96); } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes slide { from { opacity: 0; transform: translateY(6px); } }
    @keyframes day-in { from { transform: scale(.4); opacity: 0; } }
  }
  .toast { --tx: -50%; }
</style>
</head>
<body>
<main>
  <div class="upd" id="upd" hidden><span>Hay una versión nueva lista.</span><button class="primary" id="upd-go">Actualizar</button></div>
  <header class="top">
    <div>
      <h1>Inicio</h1>
      <p class="date"><span id="today"></span> <span id="sync"></span></p>
    </div>
    <button class="global" id="global" aria-label="Tasa del dólar"></button>
  </header>
  <div id="view-inicio"></div>
  <div id="view-movs" hidden></div>
  <div id="view-pres" hidden></div>
  <div id="view-metas" hidden></div>
</main>

<button class="fab" id="fab" aria-label="Nuevo movimiento">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>
<div class="toast" id="toast" hidden></div>

<nav class="tabs">
  <button class="tab on" data-view="inicio">

async function supa(path, { method = 'GET', body, headers = {}, token } = {}) {
  const res = await fetch(SUPA_URL + path, {
    method, headers: { apikey: SUPA_KEY, Authorization: `Bearer ${token ?? auth?.access_token ?? SUPA_KEY}`, 'Content-Type': 'application/json', ...headers },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const msg = data?.msg || data?.message || data?.error_description || data?.error || res.statusText;
    const err = new Error(msg); err.status = res.status; err.code = data?.code || data?.error_code || '';
    throw err;
  }
  return data;
}

}

// Un registro por persona en la tabla «finanzas»: {user_id, data, updated_at}.
let pollTimer = 0, lastSeen = '';
const hasData = st => st.cuentas.length || st.movs.length || st.metas.length;
async function connectSupabase() {
  setSync('wait');
  if (!(await ensureToken())) { setSync(auth ? 'error' : 'local'); return; }
  const uid = auth.uid;
  cloudRef = { set: async data => {
    if (!(await ensureToken())) throw new Error('sin sesión');
    const rows = await supa(`/rest/v1/${TABLE}`, { method: 'POST', body: { user_id: uid, data, updated_at: new Date().toISOString() },
      headers: { Prefer: 'resolution=merge-duplicates,return=representation' } }).catch(e => { if (e.code === '42P01' || e.status === 404) e.code = 'notable'; throw e; });
    lastSeen = rows?.[0]?.updated_at || lastSeen;
  } };
  const pull = async (first = false) => {
    if (!auth || writing || dirty || pending || !navigator.onLine) return;
    if (!(await ensureToken())) return;
    let rows;
    try { rows = await supa(`/rest/v1/${TABLE}?select=data,updated_at&user_id=eq.${uid}`); }
    catch (e) { setSync(e.code === '42P01' || e.status === 404 ? 'notable' : 'error'); return; }
    const row = rows?.[0];
    if (!row) { if (first && hasData(state)) pushCloud(); else setSync('ok'); return; }
    if (row.updated_at === lastSeen) { setSync('ok'); return; }
    const remote = normalize(row.data);
    if (first && hasData(state) && JSON.stringify(remote) !== JSON.stringify(state)) {
      // Hay datos en los dos sitios: que decida la persona, nunca pisar en silencio.
      showMsg(`<h2>¿Qué datos conservar?</h2>
        <p class="meta" style="margin-top:12px">Tu cuenta tiene ${remote.cuentas.length} ${remote.cuentas.length === 1 ? 'cuenta' : 'cuentas'} y ${remote.movs.length} movimientos; este teléfono tiene ${state.cuentas.length} y ${state.movs.length}.</p>
        <div class="dialog-actions"><button class="link" id="keep-local">Subir los de este teléfono</button><button class="primary" id="keep-remote">Usar los de la cuenta</button></div>`);
      $('#keep-remote').onclick = () => { adopt(remote, row.updated_at); $('#msg-dialog').close(); };
      $('#keep-local').onclick = () => { $('#msg-dialog').close(); pushCloud(); };
      return;
    }
    adopt(remote, row.updated_at);
  };
  const adopt = (remote, at) => { state = remote; lastSeen = at; try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} renderAll(); setSync('ok'); };
  await pull(true);
  clearInterval(pollTimer);
  pollTimer = setInterval(() => { if (document.visibilityState === 'visible') pull(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
}

async function connectCloud() {
  if (!window.claude?.use) { if (auth) connectSupabase(); else setSync('local'); return; }
  setSync('wait');
  try {
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const id = db && user ? await user.id() : null;
    if (!id) { setSync('local'); return; }
    cloudRef = db.doc(`data/users/${id}/finanzas`);
  } catch { setSync('local'); return; }
  let first = true;
  cloudRef.onSnapshot(snap => {
    // Mientras haya cambios propios en camino, manda lo local.
    if (snap.metadata.hasPendingWrites || writing || dirty) return;
    if (snap.exists) {
      state = normalize(structuredClone(snap.data()));
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {}
      renderAll();
      setSync('ok');
    } else if (first && hasData(state)) {
      pushCloud(); // Primera vez: sube lo que ya había en este dispositivo.
    } else setSync('ok');
    first = false;
  }, () => setSync('error'));
}

const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const today = () => dayKey(new Date());
const thisMonth = () => today().slice(0, 7);
const parseDay = day => new Date(day + 'T12:00');
const shiftMonth = (mk, n) => { const [y, m] = mk.split('-').map(Number); return dayKey(new Date(y, m - 1 + n, 1)).slice(0, 7); };
const monthName = (mk, opts = { month: 'long', year: 'numeric' }) => {
  const t = parseDay(mk + '-01').toLocaleDateString('es', opts);
  return t[0].toUpperCase() + t.slice(1);
};
const shortDate = day => parseDay(day).toLocaleDateString('es', { day: 'numeric', month: 'short' });
const longDate = day => parseDay(day).toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });

// ---------- Cálculos
const cuenta = id => state.cuentas.find(c => c.id === id);
const categoria = id => state.categorias.find(c => c.id === id) || { id, nombre: 'Sin categoría', icono: 'punto', color: '' };
const meta = id => state.metas.find(m => m.id === id);
const rate = () => state.tasa[state.tasa.uso] || state.tasa.bcv || state.tasa.paralelo || 0;
// USD y USDT van 1 a 1; los bolívares, con la tasa guardada en el movimiento (o la de hoy).
const toUSD = (monto, mon, t = rate()) => mon === 'VES' ? (t ? monto / t : 0) : monto;
const fromUSD = (usd, mon, t = rate()) => mon === 'VES' ? usd * t : usd;
const convert = (monto, de, a, t = rate()) => fromUSD(toUSD(monto, de, t), a, t);
const movUSD = mv => toUSD(mv.monto, cuenta(mv.cuenta)?.moneda, mv.tasa || rate());
const view$ = usd => state.verEn === 'VES' ? money(fromUSD(usd, 'VES'), 'VES') : money(usd, 'USD');

function balance(c) {
  let b = +c.inicial || 0;
  for (const mv of state.movs) {
    if (mv.cuenta === c.id) b += mv.tipo === 'ingreso' ? mv.monto : -mv.monto;
    if (mv.tipo === 'transfer' && mv.destino === c.id) b += mv.montoDestino;
  }
  return b;
}
const totalUSD = () => state.cuentas.reduce((s, c) => s + toUSD(balance(c), c.moneda), 0);
const inMonth = mk => state.movs.filter(mv => mv.fecha.startsWith(mk));
function monthTotals(mk) {
  let ing = 0, gas = 0;
  for (const mv of inMonth(mk)) {
    if (mv.tipo === 'ingreso') ing += movUSD(mv);
    if (mv.tipo === 'gasto') gas += movUSD(mv);
  }
  return { ing, gas };
}
function spentByCat(mk) {
  const r = {};
  for (const mv of inMonth(mk)) if (mv.tipo === 'gasto') r[mv.categoria] = (r[mv.categoria] || 0) + movUSD(mv);
  return r;
}
// Lo apartado en una meta: aportes menos retiros, en dólares.
const metaSaved = m => state.movs.filter(mv => mv.tipo === 'meta' && mv.meta === m.id).reduce((s, mv) => s + movUSD(mv), 0);
// Pagos programados que vencen este mes (o ya vencieron) y aún no se pagan.
const pendientes = () => state.programados.filter(p => p.proximo.slice(0, 7) <= thisMonth())
  .sort((a, b) => a.proximo.localeCompare(b.proximo));
const progUSD = p => toUSD(p.monto, cuenta(p.cuenta)?.moneda);
function nextDate(day, freq) {
  const d = parseDay(day);
  if (freq === 'semanal') return dayKey(addDays(d, 7));
  if (freq === 'quincenal') return dayKey(addDays(d, 15));
  if (freq === 'anual') return dayKey(new Date(d.getFullYear() + 1, d.getMonth(), d.getDate()));
  const n = new Date(d.getFullYear(), d.getMonth() + 1, 1);
  n.setDate(Math.min(d.getDate(), new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate()));
  return dayKey(n);
}

// ---------- Tasa del dólar: se pide sola una vez al día; si no hay internet, se usa la última o la que escribas.
async function fetchRate(manual = false) {
  try {
    const r = await fetch('https://ve.dolarapi.com/v1/dolares', { cache: 'no-store' });
    const data = await r.json();
    const of = data.find(x => x.fuente === 'oficial')?.promedio, pa = data.find(x => x.fuente === 'paralelo')?.promedio;
    if (!of) throw 0;
    state.tasa.bcv = of; state.tasa.paralelo = pa || state.tasa.paralelo; state.tasa.fecha = today(); state.tasa.auto = true;
    save(); renderAll();
    if (manual) toast(`Tasa BCV: Bs ${fmtNum(of)}`);
  } catch {
    if (manual) toast('Sin conexión: escribe la tasa a mano.');
  }
}

// ---------- Movimientos
let movMonth = thisMonth(), movTipo = '', movAcc = '', movDay = '', movQuery = '', movCal = false, movSearch = false;
function movLabel(mv) {
  if (mv.tipo === 'transfer') return `${cuenta(mv.cuenta)?.nombre || '¿?'} → ${cuenta(mv.destino)?.nombre || '¿?'}`;
  if (mv.tipo === 'meta') return `${mv.monto < 0 ? 'Retiro de' : 'Ahorro para'} ${meta(mv.meta)?.nombre || 'una meta'}`;
  return mv.nota || categoria(mv.categoria).nombre;
}
function movHTML(mv) {
  const c = cuenta(mv.cuenta);
  const isT = mv.tipo === 'transfer', isM = mv.tipo === 'meta';
  const look = isT ? { icono: 'flechas', color: '' } : isM ? (meta(mv.meta) || { icono: 'hucha' }) : categoria(mv.categoria);
  const sub = [isT || isM ? '' : (mv.nota ? categoria(mv.categoria).nombre : ''), c?.nombre].filter(Boolean).join(' · ');
  const inc = mv.tipo === 'ingreso' || (isM && mv.monto < 0);
  const n = Math.abs(mv.monto);
  const usdLine = c?.moneda === 'VES' ? `<small>${money(movUSD(mv), 'USD')}</small>` : '';
  return `<section class="item${justAdded === mv.id ? ' pop' : ''}" style="${colorVar(look)}">
    <button class="row" style="width:100%" data-act="edit-mov" data-id="${mv.id}">
      <span class="dot">${icon(look.icono)}</span>
      <span class="title"><div class="name">${esc(movLabel(mv))}</div><div class="sub">${esc(sub)}</div></span>
      <span class="amt${inc ? ' in' : ''}">${isT ? '' : inc ? '+' : '−'}${money(n, c?.moneda)}${usdLine}</span>
    </button>
  </section>`;
}

function renderMovs() {
  const mk = movMonth;
  const [y, m] = mk.split('-').map(Number);
  let list = inMonth(mk);
  if (movAcc) list = list.filter(mv => mv.cuenta === movAcc || mv.destino === movAcc);
  if (movTipo) list = list.filter(mv => mv.tipo === movTipo);
  // Calendario (opcional): cada día se tiñe de rojo según cuánto se gastó.
  let cal = '';
  if (movCal) {
    const offset = (new Date(y, m - 1, 1).getDay() + 6) % 7, days = new Date(y, m, 0).getDate();
    const perDay = {}, incDay = {};
    for (const mv of list) {
      if (mv.tipo === 'gasto') perDay[mv.fecha] = (perDay[mv.fecha] || 0) + movUSD(mv);
      if (mv.tipo === 'ingreso') incDay[mv.fecha] = true;
    }
    const maxDay = Math.max(0, ...Object.values(perDay));
    cal = ['L', 'M', 'X', 'J', 'V', 'S', 'D'].map(d => `<div class="wd">${d}</div>`).join('') + '<div></div>'.repeat(offset);
    for (let n = 1; n <= days; n++) {
      const day = dayKey(new Date(y, m - 1, n));
      const h = maxDay ? (perDay[day] || 0) / maxDay : 0;
      const cls = [perDay[day] ? 'has' : '', h > .45 ? 'hot' : '', incDay[day] ? 'inc' : '', day === today() ? 'today' : '', day === movDay ? 'sel' : '', day > today() ? 'future' : ''].join(' ');
      cal += `<button class="day ${cls}" data-day="${day}" style="--i:${n};--h:${h ? .15 + h * .85 : 0}" aria-label="${longDate(day)}">${n}</button>`;
    }
    cal = `<div class="grid">${cal}</div>`;
  }
  if (movDay) list = list.filter(mv => mv.fecha === movDay);
  list.sort((a, b) => b.fecha.localeCompare(a.fecha) || b.creado - a.creado);
  const listHTML = () => {
    const q = movQuery.toLowerCase();
    const groups = {};
    for (const mv of list) {
      if (q && !(movLabel(mv) + ' ' + categoria(mv.categoria).nombre + ' ' + (mv.nota || '')).toLowerCase().includes(q)) continue;
      (groups[mv.fecha] ||= []).push(mv);
    }
    return Object.keys(groups).length ? Object.entries(groups).map(([day, mvs]) => {
      const net = mvs.reduce((s, mv) => s + (mv.tipo === 'ingreso' ? movUSD(mv) : mv.tipo === 'gasto' ? -movUSD(mv) : 0), 0);
      return `<div class="dayhead"><span>${longDate(day)}</span><b>${net ? (net > 0 ? '+' : '−') + view$(Math.abs(net)) : ''}</b></div>
        <div class="list">${mvs.map(movHTML).join('')}</div>`;
    }).join('') : `<p class="empty">${state.cuentas.length ? 'Nada por aquí. Toca + para anotar un movimiento.' : 'Crea una cuenta en Inicio para empezar.'}</p>`;
  };
  const { ing, gas } = monthTotals(mk);
  const prevGas = monthTotals(shiftMonth(mk, -1)).gas;
  const diff = prevGas ? Math.round((gas - prevGas) / prevGas * 100) : null;

  $('#view-movs').innerHTML = `
    <div class="month">
      <button data-month="-1" aria-label="Mes anterior">‹</button>
      <h2>${monthName(mk)}</h2>
      <button data-month="1" aria-label="Mes siguiente" ${mk >= thisMonth() ? 'disabled style="visibility:hidden"' : ''}>›</button>
    </div>
    <div class="summary">
      <div><b class="pos">${view$(ing)}</b><span>ingresos</span></div>
      <div><b class="neg">${view$(gas)}</b><span>gastos</span></div>
      <div><b>${view$(ing - gas)}</b><span>balance</span></div>
    </div>
    ${diff !== null ? `<p class="compare">Gastaste <b>${Math.abs(diff)}% ${diff > 0 ? 'más' : 'menos'}</b> que en ${monthName(shiftMonth(mk, -1), { month: 'long' }).toLowerCase()}.</p>` : ''}
    <div class="filters">
      <div class="seg">${[['', 'Todos'], ['gasto', 'Gastos'], ['ingreso', 'Ingresos']].map(([v, l]) =>
        `<button class="${movTipo === v ? 'on' : ''}" data-tipo="${v}">${l}</button>`).join('')}</div>
      <button class="round${movCal ? ' on' : ''}" data-cal aria-label="Calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></button>
      <button class="round${movSearch ? ' on' : ''}" data-search aria-label="Buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></button>
    </div>
    ${movAcc ? `<p class="meta">Solo ${esc(cuenta(movAcc)?.nombre)} · <button class="link" data-acc="">ver todas</button></p>` : ''}
    ${cal}
    ${movDay ? `<p class="meta">Solo el ${longDate(movDay)} · <button class="link" data-day="${movDay}">ver todo el mes</button></p>` : ''}
    ${movSearch ? `<input class="search" id="search" placeholder="Buscar…" value="${esc(movQuery)}" type="search">` : ''}
    <div id="mov-list">${listHTML()}</div>`;
  if (movSearch) {
    $('#search').oninput = e => { movQuery = e.target.value; $('#mov-list').innerHTML = listHTML(); };
    if (!movQuery) $('#search').focus();
  }
}

$('#view-movs').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.dataset.month) { movMonth = shiftMonth(movMonth, +b.dataset.month); movDay = ''; }
  else if (b.dataset.day !== undefined) movDay = movDay === b.dataset.day ? '' : b.dataset.day;
  else if (b.dataset.tipo !== undefined) movTipo = b.dataset.tipo;
  else if (b.dataset.acc !== undefined) movAcc = b.dataset.acc;
  else if (b.hasAttribute('data-cal')) { movCal = !movCal; movDay = ''; }
  else if (b.hasAttribute('data-search')) { movSearch = !movSearch; movQuery = ''; }
  else return;
  renderMovs();
});

// ---------- Presupuesto: el plan del mes. Ingresos esperados frente a recibidos, límites frente a lo gastado.
function incomeByCat(mk) {
  const r = {};
  for (const mv of inMonth(mk)) if (mv.tipo === 'ingreso') r[mv.categoria] = (r[mv.categoria] || 0) + movUSD(mv);
  return r;
}
function planRow(c, real, plan, income) {
  const pct = plan ? real / plan : 0;
  const sub = income
    ? (real >= plan ? `Recibido${real > plan ? ` · ${view$(real - plan)} de más` : ''}` : `Faltan ${view$(plan - real)}`)
    : (real > plan ? `Te pasaste ${view$(real - plan)}` : `Quedan ${view$(plan - real)}`);
  const cls = income ? '' : pct > 1 ? 'over' : pct > .8 ? 'warn' : '';
  return `<section class="item" style="${colorVar(c)}">
    <button class="row" style="width:100%" data-act="budget" data-id="${c.id}">
      <span class="title"><div class="name">${esc(c.nombre)}</div><div class="sub">${plan ? sub : 'Sin plan'}</div></span>
      <span class="amt">${view$(real)}${plan ? `<small>de ${view$(plan)}</small>` : ''}</span>
    </button>
    ${plan ? `<div class="bar ${cls}"><i style="--w:${Math.min(pct, 1) * 100}%;${income ? 'background:var(--green)' : ''}"></i></div>` : ''}
  </section>`;
}
function renderPres() {
  const mk = thisMonth();
  const spent = spentByCat(mk), got = incomeByCat(mk);
  const { ing, gas } = monthTotals(mk);
  const pend = pendientes();
  const comprometido = pend.reduce((s, p) => s + progUSD(p), 0);
  const now = new Date(), left = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate() - now.getDate() + 1;
  const plan = (c, inc) => (inc ? state.esperado : state.presupuestos)[c.id] || 0;
  const block = tipo => {
    const inc = tipo === 'ingreso', real = inc ? got : spent;
    const cats = state.categorias.filter(c => c.tipo === tipo);
    const shown = cats.filter(c => plan(c, inc) || real[c.id]).sort((a, b) => !!plan(b, inc) - !!plan(a, inc));
    const rest = cats.filter(c => !shown.includes(c));
    return `<div class="list">${shown.map(c => planRow(c, real[c.id] || 0, plan(c, inc), inc)).join('')}</div>
      ${rest.length ? `<p class="more">+ ${rest.map(c => `<button class="link" data-act="budget" data-id="${c.id}">${esc(c.nombre)}</button>`).join(' · ')}</p>` : ''}`;
  };
  const esperado = Object.entries(state.esperado).filter(([id]) => categoria(id).tipo === 'ingreso').reduce((s, [, v]) => s + v, 0);
  const limites = Object.entries(state.presupuestos).filter(([id]) => categoria(id).tipo === 'gasto').reduce((s, [, v]) => s + v, 0);
  // Libre: lo que entra (lo esperado, si ya se sabe; si no, lo recibido) menos lo gastado y lo que falta pagar.
  const base = Math.max(ing, esperado);
  const libre = base - gas - comprometido;
  $('#view-pres').innerHTML = `
    <div class="hero">
      <div class="hero-label">Libre para gastar en ${monthName(mk, { month: 'long' }).toLowerCase()}</div>
      <div class="hero-total" style="${libre < 0 ? 'color:var(--red)' : ''}">${view$(libre)}</div>

// ---------- Anotar rápido, escrito o dictado: «gasté 5$ en café», «cobré 300 dólares de sueldo», «1.200 bs de luz».
// Fechas relativas («ayer», «hace 3 días», «el lunes», «la semana pasada») o concretas
// («el 15», «15/10», «3 de septiembre de 2026»). Devuelve la fecha y el texto sin ella.
const DIAS = ['domingo', 'lunes', 'martes', 'miercoles', 'jueves', 'viernes', 'sabado'];
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const NUM = { un: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5 };
const ymd = (y, m, d) => { const r = new Date(y, m, d); return r.getMonth() === ((m % 12) + 12) % 12 && r.getDate() === d ? r : null; };
const FECHAS = [
  [/\b(antier|anteayer|antes de ayer)\b/, now => addDays(now, -2)],
  [/\bayer\b/, now => addDays(now, -1)],
  [/\bpasado manana\b/, now => addDays(now, 2)],
  [/\bmanana\b/, now => addDays(now, 1)],
  [/\bhoy\b/, now => now],
  [/\bhace (\d+|un|una|dos|tres|cuatro|cinco) (dias?|semanas?|mes(?:es)?)\b/, (now, m) => {
    const n = +m[1] || NUM[m[1]];
    return m[2].startsWith('dia') ? addDays(now, -n) : m[2].startsWith('semana') ? addDays(now, -7 * n) : ymd(now.getFullYear(), now.getMonth() - n, Math.min(now.getDate(), 28));
  }],
  [/\b(?:la )?semana pasada\b/, now => addDays(now, -7)],
  [/\b(?:el )?(\d{1,2})[/-](\d{1,2})(?:[/-](\d{2}|\d{4}))?\b/, (now, m) => {
    let y = m[3] ? +m[3] : now.getFullYear(); if (y < 100) y += 2000;
    const d = ymd(y, +m[2] - 1, +m[1]);
    return d && !m[3] && d > addDays(now, 1) ? ymd(y - 1, +m[2] - 1, +m[1]) : d;
  }],
  [new RegExp(`\\b(?:el )?(\\d{1,2}) de (${MESES.join('|')})(?: de(?:l)? (\\d{4}))?\\b`), (now, m) => {
    const mo = MESES.indexOf(m[2]), y = m[3] ? +m[3] : now.getFullYear();
    const d = ymd(y, mo, +m[1]);
    return d && !m[3] && d > addDays(now, 1) ? ymd(y - 1, mo, +m[1]) : d;
  }],
  [new RegExp(`\\b(?:el )?(${DIAS.join('|')})( pasado)?\\b`), (now, m) => {
    let back = (now.getDay() - DIAS.indexOf(m[1]) + 7) % 7;
    if (!back && m[2]) back = 7;
    return addDays(now, -back);
  }],
  [/\bel (?:dia )?(\d{1,2})\b(?!\s*(?:\$|bs|usdt|dolar|bolivar))/, (now, m) => {
    const d = ymd(now.getFullYear(), now.getMonth(), +m[1]);
    return d && d > now ? ymd(now.getFullYear(), now.getMonth() - 1, +m[1]) : d;
  }],
];
function parseFecha(text) {
  // Minúsculas y sin tildes, letra a letra, para que las posiciones coincidan con el texto original.
  const n = [...text].map(ch => ch.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()[0] || ch).join('');
  const now = new Date();
  for (const [re, fn] of FECHAS) {
    const m = n.match(re);
    const d = m && fn(now, m);
    if (d) return { fecha: dayKey(d), rest: (text.slice(0, m.index) + ' ' + text.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim() };
  }
  return { fecha: today(), rest: text };
}
const relDay = day => day === today() ? '' : day === dayKey(addDays(new Date(), -1)) ? 'ayer' : shortDate(day);

// Se compara sin tildes: «vendí» → «vendi».
const INCOME_WORDS = /\b(cobre|cobro|recibi|ingreso|me pagaron|gane|vendi|sueldo|salario|quincena|remesa)\b/;
function parseQuick(input) {
  const { fecha, rest: text } = parseFecha(input);
  const t = ' ' + text.toLowerCase() + ' ';
  const num = t.match(/\d[\d.,]*/);
  if (!num) return null;
  const monto = parseAmount(num[0]);
  if (!(monto > 0)) return null;
  let moneda = null;
  if (/usdt|tether|binance/.test(t)) moneda = 'USDT';
  else if (/\bbs\.?\b|bol[ií]var|bolos|\bves\b/.test(t) || /\d\s*bs/.test(t)) moneda = 'VES';
  else if (/\$|d[oó]lar|\busd\b|verdes/.test(t)) moneda = 'USD';
  const tipo = INCOME_WORDS.test(t.normalize('NFD').replace(/[\u0300-\u036f]/g, '')) ? 'ingreso' : 'gasto';
  // Cuenta: la que se nombre; si no, la primera en esa moneda; si no, la primera.
  const acc = state.cuentas.find(c => t.includes(c.nombre.toLowerCase()))
    || state.cuentas.find(c => c.moneda === moneda) || state.cuentas[0];
  if (!acc) return null;
  let m = monto;
  if (moneda && moneda !== acc.moneda) m = convert(monto, moneda, acc.moneda);
  const words = t.normalize('NFD').replace(/[̀-ͯ]/g, '');
  const strip = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const cats = state.categorias.filter(c => c.tipo === tipo);
  const cat = cats.find(c => [c.nombre, ...(c.palabras || '').split(/\s+/)].filter(Boolean)
    .some(w => new RegExp(`\\b${strip(w).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}`).test(words)))
    || cats.find(c => c.id.startsWith('otros')) || cats[0];
  // Nota: lo que va después de «en», «de» o «para», si lo hay.
  const nm = text.match(/\b(?:en|de|para|por)\s+(?:un[ao]?\s+|el\s+|la\s+|los\s+|las\s+)?(.+)$/i);
  let nota = nm ? nm[1].replace(/\d[\d.,]*\s*(\$|bs\.?|usdt|d[oó]lares?|bol[ií]vares?)?/gi, '').trim() : '';
  nota = nota ? nota[0].toUpperCase() + nota.slice(1) : '';
  return { tipo, monto: Math.round(m * 100) / 100, cuenta: acc.id, categoria: cat.id, fecha, nota, original: moneda && moneda !== acc.moneda ? money(monto, moneda) : '' };
}
function setupQuick() {
  const form = $('#quick');
  form.onsubmit = e => {
    e.preventDefault();
    const text = $('#quick-text').value.trim();
    if (!text) return;
    if (!state.cuentas.length) { openForm('cuenta'); return; }
    const mv = parseQuick(text);
    if (!mv) { toast('No encontré un monto. Prueba: «Gasté 5$ en café».'); return; }
    const { original } = mv; delete mv.original;
    addMov(mv);
    $('#quick-text').value = '';
    const c = cuenta(mv.cuenta);
    toast(`${mv.tipo === 'ingreso' ? 'Ingreso' : 'Gasto'} ${money(mv.monto, c.moneda)}${original ? ` (${original})` : ''} · ${categoria(mv.categoria).nombre} · ${c.nombre}${relDay(mv.fecha) ? ' · ' + relDay(mv.fecha) : ''}`,
      () => removeMov(mv.id), () => openForm('mov', state.movs.find(x => x.id === mv.id)));
  };
  // Dictado con el reconocimiento de voz del propio navegador (Chrome lo trae; no necesita Claude).
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  const mic = $('#mic');
  mic.hidden = false;
  mic.onclick = () => {
    const rec = new SR();
    rec.lang = 'es-VE'; rec.interimResults = false;
    mic.classList.add('rec');
    rec.onresult = ev => { $('#quick-text').value = ev.results[0][0].transcript; form.requestSubmit(); };
    rec.onend = () => mic.classList.remove('rec');
    rec.onerror = () => { mic.classList.remove('rec'); toast('No te escuché. Revisa el permiso del micrófono.'); };
    rec.start();
  };
}

const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function celebrate(m) {
  const el = $('#celebration');
  el.innerHTML = `<canvas class="cele-canvas"></canvas><div class="cele-inner">
    <div class="cele-coin">${CHECK}</div>
    <div class="cele-big">${view$(metaSaved(m))}</div>
    <p class="cele-label">¡Meta cumplida!</p>
    <p class="motivation">${esc(m.nombre)}</p>
    <p class="meta">Cada aporte fue un voto por la persona ahorradora que eres.</p>
    <button class="cele-go" id="cele-go">Continuar</button>
  </div>`;
  el.classList.remove('out');
  el.hidden = false;
  $('#cele-go').focus({ preventScroll: true });
  navigator.vibrate?.([12, 40, 24, 40, 8]);
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setTimeout(() => {
      const r = el.querySelector('.cele-coin').getBoundingClientRect();
      burst(el.querySelector('.cele-canvas'), r.left + r.width / 2, r.top + r.height / 2);
    }, 350);
  }
}
// Monedas en canvas: un solo color, con gravedad, arrastre y desvanecimiento.
function burst(canvas, cx, cy) {
  const dpr = Math.min(devicePixelRatio || 1, 3);
  canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const col = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#12a150';
  const parts = Array.from({ length: 46 }, () => {
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.6, v = 260 + Math.random() * 320;
    return { x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 2 + Math.random() * 3, life: .8 + Math.random() * .6, t: 0 };
  });
  let last = performance.now();
  const tick = now => {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    let alive = false;
    for (const p of parts) {
      p.t += dt;
      if (p.t >= p.life) continue;
      alive = true;
      p.vy += 900 * dt; p.vx *= .985; p.vy *= .985;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const k = 1 - p.t / p.life;
      ctx.globalAlpha = k * k;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r, p.r * Math.abs(Math.cos(p.t * 9)), 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (alive) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  };
  requestAnimationFrame(tick);
}
function closeCelebration() {
  const el = $('#celebration');
  if (el.hidden) return;
  el.classList.add('out');
  setTimeout(() => { el.hidden = true; el.classList.remove('out'); }, 200);
}
$('#celebration').addEventListener('click', e => { if (e.target.id === 'cele-go') closeCelebration(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCelebration(); });

// ---------- Copia de seguridad: un archivo .json con todo. Dentro de Claude no hay descargas, así que se oculta.
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function setupBackup() {
  if (window.claude?.use || auth) { $('#backup').hidden = true; return; }   // con cuenta, la copia local sobra
  $('#backup-out').onclick = () => download(`finanzas-${today()}.json`, JSON.stringify(state, null, 2), 'application/json');
  $('#csv-out').onclick = () => {
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const TIPO = { gasto: 'Gasto', ingreso: 'Ingreso', transfer: 'Transferencia', meta: 'Meta' };
    const rows = [['Fecha', 'Tipo', 'Cuenta', 'Moneda', 'Monto', 'Categoría', 'Nota', 'Equivalente USD', 'Tasa']]
      .concat([...state.movs].sort((a, b) => a.fecha.localeCompare(b.fecha)).map(mv => {
        const c = cuenta(mv.cuenta);
        const sign = mv.tipo === 'ingreso' ? 1 : -1;
        return [mv.fecha, TIPO[mv.tipo], c?.nombre, c?.moneda, (sign * mv.monto).toFixed(2), mv.tipo === 'transfer' ? '→ ' + (cuenta(mv.destino)?.nombre || '') : mv.tipo === 'meta' ? meta(mv.meta)?.nombre : categoria(mv.categoria).nombre,
          mv.nota, (sign * movUSD(mv)).toFixed(2), mv.tasa || ''];
      }));
    download(`movimientos-${today()}.csv`, '﻿' + rows.map(r => r.map(q).join(';')).join('\n'), 'text/csv');
  };
  $('#backup-in').onclick = () => $('#backup-file').click();
  $('#backup-file').onchange = async e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    let data;
    try { data = normalize(JSON.parse(await file.text())); } catch { dialogResult('Archivo no válido', 'Ese archivo no es una copia de esta app.'); return; }
    if (!Array.isArray(data.movs) || !Array.isArray(data.cuentas)) { dialogResult('Archivo no válido', 'Ese archivo no es una copia de esta app.'); return; }
    showMsg(`<h2>¿Restaurar?</h2>
      <p class="meta" style="margin-top:12px">La copia tiene ${data.cuentas.length} ${data.cuentas.length === 1 ? 'cuenta' : 'cuentas'} y ${data.movs.length} movimientos. Sustituirá lo que hay ahora en este teléfono.</p>
      <div class="dialog-actions"><button class="link" data-close>Cancelar</button><button class="primary" id="restore-go">Restaurar</button></div>`);
    $('#restore-go').onclick = () => { state = data; save(); renderAll(); $('#msg-dialog').close(); };
  };
}

// Sin internet: el service worker guarda la app en el teléfono tras la primera apertura.
// Actualizar nunca toca tus datos: viven aparte, en el almacenamiento del teléfono.
let swReg = null;
const showUpdate = () => { $('#upd').hidden = false; };
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(r => {
    swReg = r;
    if (r.waiting) showUpdate();
    r.addEventListener('updatefound', () => {
      const w = r.installing;
      w?.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) showUpdate(); });
    });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload());
}
$('#upd-go').onclick = () => { swReg?.waiting?.postMessage('SKIP_WAITING'); setTimeout(() => location.reload(), 600); };
async function checkUpdate() {
  if (!navigator.onLine) { dialogResult('Sin internet', 'Para buscar una versión nueva hace falta conexión. Tus datos siguen aquí igual.'); return; }
  if (!swReg) { location.reload(); return; }
  const b = $('#check-upd');
  b.textContent = 'Buscando…';
  try { await swReg.update(); } catch {}
  setTimeout(() => {
    b.textContent = 'Buscar actualización';
    if (swReg.waiting || swReg.installing) showUpdate();
    else dialogResult('Al día', `Tienes la última versión (v${APP_VERSION}).`);
  }, 1500);
}

renderAll();
if (!state.perfil.nombre) openForm('perfil', null, { bienvenida: true });
setSync('local');
connectCloud();
if (state.tasa.fecha !== today() || !state.tasa.bcv) fetchRate();
</script>
</body>
</html>
