<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0e0e0e">
<meta name="description" content="Enfoque: menos teléfono y más de lo que importa.">
<title>Enfoque</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --bg: #ffffff; --text: #111111; --muted: #8a8a8a; --line: #ededed; --soft: #f3f3f5; --empty: #e6e6e6;
    --accent: #3b5bdb; --on-accent: #ffffff; --red: #e03131; --amber: #e8590c; --green: #2f9e44;
    --spring: linear(0, 0.009, 0.035 2.1%, 0.141 4.4%, 0.723 12.9%, 0.938 16.7%, 1.017 19.4%, 1.067, 1.099 24.3%, 1.108 26%, 1.103, 1.085 30.4%, 1.006 39%, 0.993 42.4%, 0.99 46.3%, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e0e; --text: #f2f2f2; --muted: #7a7a7a; --line: #1f1f1f; --soft: #1a1a1c; --empty: #2a2a2a;
      --accent: #748ffc; --on-accent: #0e0e0e;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0e0e; --text: #f2f2f2; --muted: #7a7a7a; --line: #1f1f1f; --soft: #1a1a1c; --empty: #2a2a2a;
    --accent: #748ffc; --on-accent: #0e0e0e;
  }
  /* Fondo del propio sistema en todo el alto, sin franja blanca arriba ni abajo (igual que el Habit Tracker). */
  html { background: var(--bg); color-scheme: light dark; min-height: 100%; overscroll-behavior-y: none; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font);
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  main { max-width: 520px; margin: 0 auto; padding-block: 48px calc(48px + env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  a { color: inherit; }
  h1 { font-size: 2rem; font-weight: 600; letter-spacing: -.02em; margin: 0; line-height: 1.15; }
  h2 { font-size: 1.25rem; font-weight: 600; letter-spacing: -.01em; margin: 0 0 6px; }
  h3 { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 36px 0 8px; }
  .hello { color: var(--muted); font-size: 1rem; margin: 0; }
  .date { color: var(--muted); margin: 2px 0 28px; }
  .note, .meta { color: var(--muted); font-size: .9rem; margin: 0 0 16px; }
  .link { color: var(--muted); font-size: .9rem; }
  .link:hover { color: var(--text); }
  .num { font-variant-numeric: tabular-nums; }

  .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .global { text-align: right; flex: none; }
  .g-num { font-size: 1.6rem; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .g-sub { color: var(--muted); font-size: .8rem; }

  /* La pregunta de cada vez que tomas el teléfono */
  .q { font-size: 1.15rem; font-weight: 500; margin: 0 0 14px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .choice { text-align: left; background: var(--soft); border-radius: 16px; padding: 14px 14px 16px; min-height: 92px;
    display: flex; flex-direction: column; gap: 6px; transition: transform .35s var(--spring); }
  .choice:active { transform: scale(.96); }
  .choice b { font-weight: 600; }
  .choice span { color: var(--muted); font-size: .85rem; line-height: 1.3; }
  .choice svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .choice.main { background: var(--accent); color: var(--on-accent); }
  .choice.main span { color: inherit; opacity: .8; }

  /* Estadísticas del día */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 28px; }
  .stat { padding: 14px 0; }
  .stat + .stat { padding-left: 12px; border-left: 1px solid var(--line); }
  .stat b { display: block; font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stat span { color: var(--muted); font-size: .8rem; }
  .stat .over { color: var(--red); }

  /* Filas: misma pieza que los hábitos del Habit Tracker */
  .row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border-top: 1px solid var(--line); padding: 13px 0; }
  .rows > .row:last-child { border-bottom: 1px solid var(--line); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--text)); flex: none; margin: 0 4px; }
  .box { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--muted); flex: none; margin: 0 1px; }
  .row .t { flex: 1; min-width: 0; }
  .row .t div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t small { display: block; color: var(--muted); font-size: .82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .tag { color: var(--muted); font-size: .8rem; flex: none; }
  .row .tag.late { color: var(--red); }
  .more { color: var(--muted); font-size: .85rem; padding: 10px 0 0; }
  .empty { color: var(--muted); font-size: .9rem; padding: 4px 0; }

  /* Semana */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; margin-top: 8px; }
  .bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
  .bar i { display: block; width: 100%; max-width: 28px; border-radius: 6px 6px 3px 3px; background: var(--empty); min-height: 3px;
    transform-origin: bottom; animation: grow .7s var(--spring) both; }
  .bar.on i { background: var(--accent); }
  .bar span { font-size: .75rem; color: var(--muted); }
  .bar.today span { color: var(--text); font-weight: 600; }
  @keyframes grow { from { transform: scaleY(0); } }
  .week-sum { color: var(--muted); font-size: .88rem; margin: 12px 0 0; }
  .week-sum b { color: var(--text); font-weight: 600; }

  footer { margin-top: 44px; display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .85rem; }

  /* Botones */
  .primary { background: var(--accent); color: var(--on-accent); border-radius: 999px; padding: 12px 22px; font-weight: 600; }
  .primary:disabled { opacity: .4; }
  .outline { border: 1.5px solid var(--line); border-radius: 999px; padding: 10px 18px; }
  .wide { width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: var(--soft); border-radius: 999px; padding: 7px 14px; font-size: .9rem; font-variant-numeric: tabular-nums; }
  .chip.on { background: var(--text); color: var(--bg); }

  /* Formularios */
  .field { margin: 0 0 18px; }
  .field > label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
  input, textarea, select { width: 100%; box-sizing: border-box; font: inherit; color: inherit; background: transparent; padding: 6px 0;
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0; outline: none; }
  input:focus, textarea:focus, select:focus { border-color: var(--text); }
  textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
  select option { background: var(--bg); color: var(--text); }

  /* Hoja que sube desde abajo */
  dialog { border: 0; padding: 0; background: var(--bg); color: var(--text); width: min(520px, 100vw); max-width: 100vw; max-height: 88dvh;
    margin: auto auto 0; border-radius: 22px 22px 0 0; box-sizing: border-box; }
  dialog[open] { animation: up .5s var(--spring); }
  dialog::backdrop { background: rgb(0 0 0 / .45); animation: fade .25s; }
  @media (min-width: 600px) { dialog { margin: auto; border-radius: 22px; } }
  .sheet { padding: 22px max(20px, env(safe-area-inset-left, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)); overflow-y: auto; max-height: 88dvh; box-sizing: border-box; }
  .sheet .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--empty); margin: -8px auto 16px; }
  .actions { display: flex; justify-content: flex-end; align-items: center; gap: 18px; margin-top: 22px; flex-wrap: wrap; }
  .actions.stack { flex-direction: column; align-items: stretch; gap: 12px; }
  .actions.stack .link { text-align: center; padding: 6px 0; }
  .green { color: var(--green); } .red { color: var(--red); }
  .pros { margin: 6px 0 14px; padding-left: 18px; }
  .pros li { margin: 2px 0; }
  .set-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .set-row span small { display: block; color: var(--muted); font-size: .8rem; }
  .set-row select { width: auto; border: 0; text-align: right; }
  .app-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .app-row .t { flex: 1; min-width: 0; }
  .app-row small { display: block; color: var(--muted); font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x { color: var(--muted); font-size: 1.3rem; line-height: 1; padding: 4px 8px; }
  .add-app { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 10px; align-items: end; margin-top: 10px; }

  /* Pantallas completas: espera y enfoque */
  .full { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; animation: fade .3s; overflow-y: auto; }
  .full[hidden] { display: none; }
  .full .inner { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .full .lead { color: var(--muted); margin: 0; }
  .full .lead b { color: var(--text); }
  .full .lead.red, .full .lead .red { color: var(--red); }
  .breath { width: 180px; height: 180px; border-radius: 50%; display: grid; place-items: center; margin: 18px 0;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 30%, transparent), color-mix(in srgb, var(--accent) 8%, transparent) 70%);
    animation: breath 8s ease-in-out infinite; }
  .breath span { font-size: 1rem; color: var(--text); }
  @keyframes breath { 0%, 100% { transform: scale(.72); } 50% { transform: scale(1); } }
  .count { font-size: 3rem; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin: 0; line-height: 1; }
  .why { background: var(--soft); border-radius: 16px; padding: 14px 16px; text-align: left; width: 100%; box-sizing: border-box; font-size: .92rem; }
  .why b { font-weight: 600; }
  .why .red { display: block; margin-top: 4px; }
  .ring { --p: 0%; width: 240px; height: 240px; border-radius: 50%; display: grid; place-items: center; position: relative; margin: 10px 0; }
  .ring::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(var(--accent) var(--p), var(--empty) 0);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5.5px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5.5px)); }
  .ring .count { font-size: 3.4rem; }
  .focus-what { font-size: 1.15rem; font-weight: 500; margin: 0; }

  /* Iniciativa y ciencia */
  .amber { color: var(--amber); }
  .meter { display: flex; justify-content: space-between; align-items: baseline; font-size: .9rem; color: var(--muted); }
  .meter b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .meter-bar { height: 6px; border-radius: 3px; background: var(--empty); margin: 6px 0 12px; overflow: hidden; }
  .meter-bar i { display: block; height: 100%; background: var(--green); border-radius: 3px; transition: width .6s var(--spring); }
  .sci { font-size: .82rem; color: var(--muted); border-left: 2px solid var(--accent); padding: 2px 0 2px 10px; margin: 0 0 16px; }
  .btn { display: block; text-align: center; text-decoration: none; }
  .woop { margin: 4px 0 14px; font-size: .9rem; }
  .woop dt { color: var(--muted); font-size: .78rem; margin-top: 8px; }
  .woop dd { margin: 0; }
  .refs li { margin: 0 0 12px; font-size: .9rem; }
  .refs small { display: block; color: var(--muted); font-size: .78rem; }
  .times { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; z-index: 20;
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: .9rem; pointer-events: none;
    transition: opacity .25s, transform .45s var(--spring); max-width: calc(100vw - 48px); text-align: center; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #update { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 15; max-width: 488px; margin: 0 auto;
    background: var(--text); color: var(--bg); border-radius: 16px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: .9rem; }
  #update[hidden] { display: none; }
  #update button { font-weight: 600; }

  @keyframes up { from { transform: translateY(40%); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <p class="hello" id="hello"></p>
      <h1 id="title">Enfoque</h1>
      <p class="date" id="today"></p>
    </div>
    <div class="global">
      <div class="g-num" id="g-focus">0 min</div>
      <div class="g-sub">enfoque hoy</div>
    </div>
  </header>

  <section>
    <p class="q">¿Para qué tomaste el teléfono?</p>
    <div class="choices">
      <button class="choice" data-go="concreto">
        <svg viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>
        <b>Algo concreto</b><span>Lo haces y lo sueltas</span>
      </button>
      <button class="choice main" data-go="enfoque">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>
        <b>Enfocarme</b><span>Una sesión sin teléfono</span>
      </button>
      <button class="choice" data-go="costumbre">
        <svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M4.2 7.5l2.6 1.5M17.2 15l2.6 1.5M4.2 16.5l2.6-1.5M17.2 9l2.6-1.5"/></svg>
        <b>Por costumbre</b><span>Una alternativa que sume</span>
      </button>
      <button class="choice" data-go="distraer">
        <svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2.5"/><path d="M11 18h2"/></svg>
        <b>Distraerme</b><span>Con espera y límite diario</span>
      </button>
    </div>
  </section>

  <div class="stats" id="stats"></div>

  <section>
    <h3>Tomar la iniciativa</h3>
    <div id="ini"></div>
  </section>

  <section>
    <h3>Pendiente hoy</h3>
    <div id="pend"></div>
  </section>

  <section>
    <h3>Últimos 7 días</h3>
    <div class="week" id="week"></div>
    <p class="week-sum" id="week-sum"></p>
  </section>

  <footer>
    <span><button class="link" id="open-settings">Ajustes</button> · <button class="link" id="open-sci">Por qué funciona</button></span>
    <span id="ver"></span>
  </footer>
</main>

<dialog id="sheet"><div class="sheet" id="sheet-body"></div></dialog>
<div class="full" id="gate" hidden><div class="inner" id="gate-body"></div></div>
<div class="full" id="focus" hidden><div class="inner" id="focus-body"></div></div>
<div id="toast"></div>
<div id="update" hidden><span>Hay una versión nueva lista.</span><button id="update-go">Actualizar</button></div>

<script>

const KEY = 'enfoque-v1';
// El Habit Tracker vive en el mismo dominio (gads4532.github.io), así que sus datos están en este mismo teléfono.
const HT_KEY = 'habit-tracker-v1', HT_AUTH = 'habit-auth';

  { id: 'fb', nombre: 'Facebook', url: 'https://www.facebook.com/' },
];
const DEFAULT_ALTS = [
  'Leer 10 páginas de un libro',
  'Caminar 10 minutos sin el teléfono',
  'Tomar agua y estirarte 2 minutos',
  'Ordenar tu espacio durante 5 minutos',

  'Llamar a alguien que aprecias',
  'Respirar un minuto con los ojos cerrados',
  'Avanzar 5 minutos en la tarea más importante',
];
const MINUTOS_ENFOQUE = [15, 25, 50, 90];
const MINUTOS_SALIDA = [5, 10, 15, 30];
const FRASE = 'Elijo distraerme';
// Capas de Dunbar: cuanto más cercana la relación, más frecuente el contacto.
const CADA = { 7: 'Íntimo · cada semana', 14: 'Muy cercano · cada 2 semanas', 30: 'Cercano · cada mes', 90: 'Amigo · cada 3 meses', 365: 'Conocido · cada año' };
const SALUDOS = ['Hola, {n}. Me acordé de ti, ¿cómo has estado?', 'Hola, {n}. Hace tiempo que no hablamos y quería saber cómo vas.', 'Hola, {n}. Vi algo que me recordó a ti. ¿Qué tal todo?'];
const PLANTILLAS = {
  Saludo: n => SALUDOS[Math.floor(Math.random() * SALUDOS.length)].replace('{n}', n),
  Gracias: n => `Hola, ${n}. Quería darte las gracias por [lo que hiciste]. Me ayudó a [cómo te afectó]. De verdad significa mucho para mí.`,

};
// Preguntas con sustancia: las conversaciones profundas resultan menos incómodas y más cercanas de lo que se espera.
const PREGUNTAS = ['¿Qué es lo que más te ilusiona ahora mismo?', '¿Qué aprendiste este año que te cambió algo?', '¿Por qué estás más agradecido últimamente?', '¿Qué harías si supieras que no puedes fallar?', '¿Cuál fue el mejor momento de tu semana?', '¿Qué te gustaría que la gente supiera de ti?', '¿Qué te está costando más en este momento?', '¿Qué decisión reciente te enorgullece?', '¿Con qué sueñas para dentro de cinco años?'];
// Configuración del teléfono (Olson et al., 2022): pequeños cambios que bajan el uso problemático.
const CONFIG = [
  ['inicio', 'Quitar las redes de la pantalla de inicio', 'Mantén pulsado el icono → Quitar (no desinstalar).'],
  ['enfoque', 'Poner Enfoque donde estaban', 'Que el pulgar encuentre la pregunta en vez del feed.'],
  ['notif', 'Silenciar las notificaciones de redes', 'Ajustes → Notificaciones. Deja solo llamadas y mensajes de personas. No apagues todo: eso aumenta el FOMO.'],
  ['grises', 'Pantalla en escala de grises', 'Ajustes → Bienestar digital → Modo descanso, o Accesibilidad → Corrección de color.'],
  ['dormir', 'Cargar el teléfono fuera del dormitorio', 'Un despertador barato evita la primera y la última revisión del día.'],
  ['vista', 'Ocultar el contenido en la pantalla bloqueada', 'Ajustes → Notificaciones → Pantalla de bloqueo → Ocultar contenido.'],
  ['timer', 'Temporizadores de apps', 'Ajustes → Bienestar digital → Temporizadores. El tope estricto que Enfoque no puede poner.'],
];
const TIPOS = ['Mensaje', 'Llamada', 'Plan', 'Reunión', 'Gracias'];
// Planes como verbos, para que la invitación se lea natural: «¿Te animas a tomar un café…?».
const PLAN_IDEAS = ['tomar un café', 'almorzar', 'caminar', 'hacer deporte', 'una reunión de trabajo', 'cenar'];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Fechas en hora local, como 'YYYY-MM-DD' (igual que el Habit Tracker).
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };

// Días de la semana: 0 = lunes … 6 = domingo.

// ---------- Estado
let state = load();
function load() {

function normalize(s) {

  if (!Array.isArray(s.alternativas) || !s.alternativas.length) s.alternativas = [...DEFAULT_ALTS];
  s.limite = Math.max(1, Math.min(20, +s.limite || 3));
  s.espera = [5, 10, 20, 30].includes(+s.espera) ? +s.espera : 10;
  s.dias ||= {};
  s.sesion ||= null; s.salida ||= null;
  // Iniciativa
  if (!Array.isArray(s.personas)) s.personas = [];
  for (const p of s.personas) { p.cada = +p.cada || 14; p.ultimo ||= ''; p.tel ||= ''; if (!Array.isArray(p.historial)) p.historial = []; }
  if (!Array.isArray(s.proyectos)) s.proyectos = [];
  for (const p of s.proyectos) { if (!Array.isArray(p.pasos)) p.pasos = []; p.creado ||= today(); for (const k of ['deseo', 'resultado', 'obstaculo', 'plan', 'paso', 'minima', 'cuando', 'hora', 'donde', 'nota', 'recompensa']) p[k] ||= ''; }
  if (!Array.isArray(s.planes)) s.planes = [];

  s.config ||= {}; s.revision ||= '';

  if (!Array.isArray(s.ventanas) || !s.ventanas.length) s.ventanas = ['12:30', '18:00', '21:00'];
  s.ventanaMin = [10, 15, 20, 30].includes(+s.ventanaMin) ? +s.ventanaMin : 20;

function save() {

}
const EMPTY_DAY = { enfoque: 0, sesiones: 0, interrupciones: 0, resistidas: 0, aperturas: 0, distraccion: 0, alternativas: 0, concretos: 0, iniciativas: 0, pasos: 0, fomoSi: 0, fomoNo: 0 };

// ---------- Datos del Habit Tracker (solo lectura)
let htRemote = null, htEmail = '';
function htLocal() { try { return JSON.parse(localStorage.getItem(HT_KEY)); } catch { return null; } }
// Se usa la versión más reciente entre la del teléfono y la de la cuenta.
function htData() {
  const l = htLocal(), r = htRemote;
  if (l && r) return (+r.cambiado || 0) > (+l.cambiado || 0) ? r : l;
  return r || l;
}
async function supa(path, { method = 'GET', body, token } = {}) {
  const res = await fetch(SUPA_URL + path, {
    method, headers: { apikey: SUPA_KEY, Authorization: `Bearer ${token || SUPA_KEY}`, 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) { const e = new Error(res.statusText); e.status = res.status; throw e; }
  return res.json();
}
// Con la sesión del Habit Tracker se lee su fila de «estados». Si el token caducó se renueva y se devuelve
// al Habit Tracker para que su sesión siga viva.
async function htRefresh() {
  let a = null; try { a = JSON.parse(localStorage.getItem(HT_AUTH)); } catch {}
  if (!a?.access_token || !a.uid || !navigator.onLine) return;
  try {
    if ((a.expires_at || 0) - Date.now() < 60000) {
      const d = await supa('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: { refresh_token: a.refresh_token } });
      a = { ...a, access_token: d.access_token, refresh_token: d.refresh_token, expires_at: Date.now() + (d.expires_in || 3600) * 1000 };
      try { localStorage.setItem(HT_AUTH, JSON.stringify(a)); } catch {}
    }
    const rows = await supa(`/rest/v1/estados?select=data&user_id=eq.${encodeURIComponent(a.uid)}`, { token: a.access_token });
    htRemote = rows?.[0]?.data || null; htEmail = a.email || '';
    renderAll();
  } catch {}
}
function pendientes() {
  const s = htData(); if (!s) return null;
  const t = today(), w = wd(t);
  const firstHour = h => (h.horas || [])[0] || '99';
  const habits = (s.habits || [])
    .filter(h => !h.rutina && (!h.creado || h.creado <= t) && (h.dias?.length ? h.dias : ALL_DAYS).includes(w) && !s.log?.[h.id]?.[t])
    .sort((a, b) => firstHour(a) < firstHour(b) ? -1 : firstHour(a) > firstHour(b) ? 1 : 0);
  const items = (s.tareas?.items || []).filter(x => !x.hecha);
  const due = items.filter(x => x.fecha && x.fecha <= t).sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  const sinFecha = items.filter(x => !x.fecha).sort((a, b) => (b.creado || 0) - (a.creado || 0));
  return { habits, due, sinFecha, nombre: s.nombre || '' };
}
const nombre = () => state.nombre || htData()?.nombre || '';
const fmtHora = hhmm => { if (!/^\d\d:\d\d$/.test(hhmm || '')) return ''; let [h, m] = hhmm.split(':').map(Number); const ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12; return `${h}:${String(m).padStart(2, '0')} ${ap}`; };
const fmtFecha = f => { const t = today(); if (f === t) return 'Hoy'; if (f === dayKey(addDays(new Date(), -1))) return 'Ayer'; return new Date(f + 'T12:00').toLocaleDateString('es', { day: 'numeric', month: 'short' }); };
// Un recordatorio concreto para la pantalla de espera: lo que pierdes si sigues de largo.
function recordatorio() {
  const per = personasDue()[0];
  const ini = per ? `<b>En vez de mirar lo que hacen otros, toma la iniciativa:</b> escríbele a ${esc(per.nombre)} (último contacto ${fmtDias(daysSince(per.ultimo))}).
    <button class="link" style="display:block;margin-top:6px;color:var(--accent)" data-gate-per="${esc(per.id)}">Escribirle ahora</button>` : '';
  const hab = recordatorioHabito();

}
function recordatorioHabito() {
  const p = pendientes(); if (!p) return '';
  const h = p.habits.find(h => h.contras?.length) || p.habits[0];
  if (h) return `<b>${esc(h.nombre)}</b> sigue pendiente hoy.${h.contras?.length ? `<span class="red">Si no lo haces: ${esc(h.contras[0])}</span>` : h.minima ? `<span>Versión de 2 minutos: ${esc(h.minima)}</span>` : ''}`;

function renderWeek() {

}
function paintFocus() {
  const s = state.sesion; if (!s) return;
  const left = focusLeft();
  if (left <= 0) { finishFocus(true); return; }
  $('#f-left').textContent = fmtClock(left);
  $('#ring').style.setProperty('--p', `${(1 - left / (s.min * 60)) * 100}%`);
  $('#f-ints').textContent = s.ints ? `${s.ints} ${s.ints === 1 ? 'interrupción' : 'interrupciones'}` : 'Sin interrupciones';
}
function finishFocus(completa) {
  const s = state.sesion; if (!s) return;
  clearInterval(focusTick);
  const mins = completa ? s.min : Math.floor((Date.now() - s.inicio) / 60000);
  const k = dayKey(new Date(s.inicio));
  bump('enfoque', mins, k); bump('interrupciones', s.ints, k); if (completa) bump('sesiones', 1, k);
  state.sesion = null; save();
  $('#focus').hidden = true; renderAll();
  if (completa) buzz([60, 80, 60, 80, 120]);
  const pr = state.proyectos.find(x => x.id === s.pro);
  showSheet(`<h2>${completa ? 'Sesión completa' : 'Sesión terminada'}</h2>
    <p class="note">${fmtMin(mins)} de enfoque${s.que ? ` en «${esc(s.que)}»` : ''} · ${s.ints ? `${s.ints} ${s.ints === 1 ? 'interrupción' : 'interrupciones'}` : 'sin interrupciones'}. Hoy llevas ${fmtMin(dayOf(k).enfoque)}.</p>
    ${s.ints === 0 && completa ? `<p class="meta green">Ni una mirada al teléfono. Así se entrena la atención.</p>` : ''}
    <div class="actions stack">
      ${pr ? `<div class="field" style="margin:0"><label>¿Dónde lo dejas? (la siguiente frase o línea, para retomarlo sin esfuerzo)</label><input id="fr-nota" maxlength="120" value="${esc(pr.nota)}"></div>
        <button class="primary" id="fr-step">Paso hecho: definir el siguiente</button><button class="outline" id="fr-keep">Sigue pendiente: guardar nota</button>` : s.que ? `<a class="primary btn" href="${HT_URL}" target="_blank" rel="noopener">Marcarlo en el Habit Tracker</a>` : ''}
      <button class="${s.que ? 'link' : 'primary'}" id="fr-again">Otra sesión</button>
      <button class="link" id="fr-close">Cerrar</button>
    </div>`);
  $('#fr-again').onclick = () => focusForm(s.que, s.min, s.pro);
  const nota = () => { if (pr && $('#fr-nota')) { pr.nota = $('#fr-nota').value.trim(); bump('pasos', 0); save(); } };
  $('#fr-step')?.addEventListener('click', () => { nota(); pasoHecho(pr); });
  $('#fr-keep')?.addEventListener('click', () => { nota(); closeSheet(); renderAll(); toast('Nota guardada: mañana empiezas por ahí.'); });
  $('#fr-close').onclick = closeSheet;
}

// ---------- La puerta: espera, recordatorio y límite antes de abrir una distracción
function appPicker() {
  const d = dayOf(), wait = gateWait();
  showSheet(`<h2>¿Qué quieres abrir?</h2>
    <p class="note">Aperturas hoy: ${d.aperturas} de ${state.limite} · ${d.distraccion} de ${state.presupuesto} min. La próxima espera es de ${fmtSec(wait)}${sobreLimite() ? ' y tendrás que escribir una frase' : ''}.</p>
    <p class="sci">${enVentana() ? `Estás en tu ventana de revisión hasta las ${fmtHora(addMin(enVentana(), state.ventanaMin))}.` : `Fuera de tu ventana de revisión: la espera es el doble. La próxima es a las ${fmtHora(proximaVentana())}; lo que hay ahí seguirá ahí.`}</p>
    <div class="rows">${state.apps.map(a => `<button class="row" data-app="${esc(a.id)}"><span class="dot"></span><span class="t"><div>${esc(a.nombre)}</div></span><span class="tag">›</span></button>`).join('')}</div>
    ${state.apps.length ? '' : `<p class="empty">Añade tus apps en Ajustes.</p>`}
    <div class="actions"><button class="link" id="ap-close">Mejor no</button></div>`);
  $('#ap-close').onclick = () => { bump('resistidas'); save(); closeSheet(); renderAll(); toast('Bien. Ese tiempo es tuyo.'); };
  $('#sheet-body').querySelectorAll('[data-app]').forEach(b => b.onclick = () => { closeSheet(); openGate(state.apps.find(a => a.id === b.dataset.app)); });
}
// Cada apertura del día duplica la espera: 10 s, 20 s, 40 s… hasta 3 minutos.
// Fuera de las ventanas de revisión la espera es el doble (revisar por lotes, no a cada rato).
const gateWait = () => Math.min(240, state.espera * 2 ** dayOf().aperturas * (enVentana() ? 1 : 2));
const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
function enVentana() { const n = nowMin(); return state.ventanas.find(v => n >= toMin(v) && n < toMin(v) + state.ventanaMin) || ''; }
function proximaVentana() { const n = nowMin(), vs = [...state.ventanas].sort(); return vs.find(v => toMin(v) > n) || vs[0]; }
const sobreLimite = () => { const d = dayOf(); return d.aperturas >= state.limite || d.distraccion >= state.presupuesto; };
let gate = null;
function openGate(app) {
  if (!app) return;
  gate = { app, total: gateWait(), fin: 0 };
  gate.fin = Date.now() + gate.total * 1000;
  const why = recordatorio();
  $('#gate-body').innerHTML = `
    <p class="lead">Ibas a abrir <b>${esc(app.nombre)}</b></p>
    <div class="breath"><span id="g-br">Inhala</span></div>
    <p class="count" id="g-count"></p>
    ${why ? `<div class="why">${why}</div>` : ''}
    <p class="note" style="margin:0">${enVentana() ? '' : `Fuera de tu ventana de revisión (próxima: ${fmtHora(proximaVentana())}). `}Si sales de esta pantalla, la espera vuelve a empezar.</p>
    <button class="primary wide" id="g-no">Mejor no</button>`;
  $('#gate').hidden = false;
  $('#g-no').onclick = () => gateNo();
  $('#gate-body').querySelector('[data-gate-per]')?.addEventListener('click', e => {
    const per = state.personas.find(p => p.id === e.target.dataset.gatePer);
    bump('resistidas'); save(); closeGate(); renderAll(); personaSheet(per);
  });
  clearInterval(gate.tick);
  let phase = 0;
  gate.breath = setInterval(() => { const el = $('#g-br'); if (el) el.textContent = (phase = 1 - phase) ? 'Exhala' : 'Inhala'; }, 4000);
  gate.tick = setInterval(paintGate, 250); paintGate();
}
function paintGate() {
  if (!gate || gate.listo) return;
  const left = (gate.fin - Date.now()) / 1000;
  if (left > 0) { $('#g-count').textContent = Math.ceil(left); return; }
  gate.listo = true; clearInterval(gate.tick); gateChoice();
}
function gateChoice() {
  const d = dayOf(), over = sobreLimite(), app = gate.app;
  let min = 10;
  $('#gate-body').innerHTML = `
    <h2>¿Todavía quieres abrir ${esc(app.nombre)}?</h2>
    <p class="lead">Aperturas hoy: ${d.aperturas} de ${state.limite} · Te quedan ${Math.max(0, state.presupuesto - d.distraccion)} de ${state.presupuesto} min</p>
    ${over ? `<p class="lead red">Superaste tu límite de hoy. Para seguir, escribe: <b class="red">${FRASE}</b></p>
      <div class="field" style="width:100%"><input id="g-phrase" autocomplete="off" autocapitalize="sentences" placeholder="${FRASE}"></div>` : ''}
    <div class="field" style="width:100%"><label style="text-align:left">¿Para qué entras?</label>
      <div class="chips" id="g-modo"><button class="chip on" data-m="hablar">Hablar con alguien o publicar</button><button class="chip" data-m="mirar">Solo mirar</button></div>
      <p class="meta" id="g-modo-note" style="text-align:left;margin:8px 0 0"></p></div>
    <div class="field" style="width:100%"><label style="text-align:left">¿Por cuánto tiempo?</label>
      <div class="chips" id="g-min">${MINUTOS_SALIDA.map(m => `<button class="chip${m === min ? ' on' : ''}" data-m="${m}">${m} min</button>`).join('')}</div></div>
    <button class="primary wide" id="g-no">Mejor no</button>
    <button class="link" id="g-yes" ${over ? 'disabled style="opacity:.4"' : ''}>Abrir ${esc(app.nombre)} ${min} min</button>`;
  $('#g-min').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return; min = +c.dataset.m;
    $('#g-min').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    $('#g-yes').textContent = `Abrir ${app.nombre} ${min} min`;
  });
  let modo = 'hablar';
  $('#g-modo').addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return; modo = c.dataset.m;
    $('#g-modo').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
    $('#g-modo-note').textContent = modo === 'mirar' ? 'Mirar sin interactuar es el uso que más se asocia a envidia y peor ánimo (Verduyn et al., 2015). ¿Y si le escribes a alguien en vez de mirar su perfil?' : '';
  });
  $('#g-phrase')?.addEventListener('input', e => {
    const ok = e.target.value.trim().toLowerCase() === FRASE.toLowerCase();
    $('#g-yes').disabled = !ok; $('#g-yes').style.opacity = ok ? '' : '.4';
  });
  $('#g-no').onclick = () => gateNo();
  $('#g-yes').onclick = () => {
    bump('aperturas'); state.salida = { app: app.nombre, en: Date.now(), min, modo }; save();
    closeGate(); renderAll();
    salidaOculta = false;
    // Con «noopener» window.open siempre devuelve null, así que se corta el vínculo a mano.

}
function gateNo() {
  bump('resistidas'); save(); closeGate(); renderAll(); buzz(20);
  alternativas('Bien. Ese tiempo es tuyo', 'Úsalo en algo que sume:');
}
function closeGate() { if (gate) { clearInterval(gate.tick); clearInterval(gate.breath); } gate = null; $('#gate').hidden = true; }

// Al volver de la distracción se cuenta cuánto duró de verdad.
let salidaOculta = false;
function checkSalida(force = false) {
  const s = state.salida; if (!s || (!salidaOculta && !force)) return;
  const mins = (Date.now() - s.en) / 60000;
  if (mins < .5 && !force) return;
  state.salida = null;
  const k = dayKey(new Date(s.en));
  const medido = mins <= 240;
  const real = medido ? Math.max(1, Math.round(mins)) : s.min;
  bump('distraccion', real, k); save(); renderAll();
  const extra = real - s.min;
  showSheet(`<h2>Volviste de ${esc(s.app)}</h2>
    <p class="note">${medido ? `Estuviste fuera unos ${fmtMin(real)}; planeaste ${fmtMin(s.min)}.` : 'No se pudo medir: pasaron más de 4 horas. Se cuentan los minutos que planeaste.'}</p>
    ${medido && extra > 1 ? `<p class="meta red">Te pasaste ${fmtMin(extra)}. La próxima espera será de ${fmtSec(gateWait())}.</p>` : medido ? `<p class="meta green">Cumpliste lo que planeaste.</p>` : ''}
    <h3 style="margin-top:20px">Prueba de realidad</h3>
    <p style="margin:0 0 12px">¿Había algo que de verdad te habrías perdido?</p>
    <div class="chips"><button class="chip" data-fomo="si">Sí, algo importante</button><button class="chip" data-fomo="no">No, nada importante</button></div>
    <div id="sv-after"></div>`);
  $('#sheet-body').querySelectorAll('[data-fomo]').forEach(b => b.onclick = () => {
    bump(b.dataset.fomo === 'si' ? 'fomoSi' : 'fomoNo', 1, k); save(); renderAll();
    const all = Object.values(state.dias), si = all.reduce((a, v) => a + (v.fomoSi || 0), 0), tot = si + all.reduce((a, v) => a + (v.fomoNo || 0), 0);
    $('#sheet-body').querySelector('.chips').outerHTML = `<p class="meta">Hasta ahora, en <b style="color:var(--text)">${tot - si} de ${tot}</b> aperturas no había nada importante. El miedo a perderse algo es una predicción; tus datos dicen otra cosa.</p>`;
    $('#sv-after').innerHTML = `<div class="actions stack">
      ${personasDue()[0] ? `<button class="primary" id="sv-per">Escríbele a ${esc(personasDue()[0].nombre)}</button>` : ''}
      <button class="${personasDue()[0] ? 'outline' : 'primary'}" id="sv-focus">Ahora, una sesión de enfoque</button>
      <button class="link" id="sv-close">Cerrar</button></div>`;
    $('#sv-per')?.addEventListener('click', () => personaSheet(personasDue()[0]));
    $('#sv-focus').onclick = () => focusForm();
    $('#sv-close').onclick = closeSheet;
  });
}

// ---------- Tomar la iniciativa: personas, planes y proyectos
const daysSince = d => d ? Math.round((new Date(today() + 'T12:00') - new Date(d + 'T12:00')) / 864e5) : Infinity;
const fmtDias = n => n === Infinity ? 'sin registro' : n === 0 ? 'hoy' : n === 1 ? 'ayer' : `hace ${n} días`;
const addMin = (hhmm, m) => { const t = (toMin(hhmm) + m) % 1440; return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const fechaLarga = f => new Date(f + 'T12:00').toLocaleDateString('es', { weekday: 'long', day: 'numeric', month: 'long' });
// A quién le toca: cuanto más se pasó de la frecuencia que elegiste, antes sale.
function personasDue() {
  return state.personas.map(p => ({ p, r: daysSince(p.ultimo) / p.cada })).filter(x => x.r >= 1).sort((a, b) => b.r - a.r).map(x => x.p);
}
const ultimoPaso = pr => pr.pasos.length ? pr.pasos[pr.pasos.length - 1].d : pr.creado;
const proyectosActivos = () => state.proyectos.filter(p => !p.archivado).sort((a, b) => ultimoPaso(a) < ultimoPaso(b) ? -1 : ultimoPaso(a) > ultimoPaso(b) ? 1 : 0);
const planesProximos = () => state.planes.filter(p => !p.hecho && p.fecha >= today()).sort((a, b) => (a.fecha + a.hora) < (b.fecha + b.hora) ? -1 : 1);
const planesSinCerrar = () => state.planes.filter(p => !p.hecho && p.fecha < today());
// Semana de lunes a hoy.
const semanaKeys = () => { const back = wd(today()); return Array.from({ length: back + 1 }, (_, i) => dayKey(addDays(new Date(), i - back))); };
const iniciativasSemana = () => semanaKeys().reduce((a, k) => a + dayOf(k).iniciativas, 0);
// Predicción frente a resultado: cuánto más pesimista eres que la realidad.
function sesgo() {
  const xs = state.predicciones.filter(x => x.real); if (!xs.length) return null;
  return { n: xs.length, d: xs.reduce((a, x) => a + x.real - x.pred, 0) / xs.length };
}
const sesgoTxt = b => b && b.n >= 1 ? (b.d > 0.2 ? `Tus predicciones fueron, de media, <b>${b.d.toFixed(1).replace('.', ',')} puntos más pesimistas</b> que la realidad (${b.n} ${b.n === 1 ? 'contacto' : 'contactos'}).` : b.d < -0.2 ? `La realidad fue ${(-b.d).toFixed(1).replace('.', ',')} puntos peor de lo que esperabas (${b.n}). Sigue: la media se ajusta con más contactos.` : `Tus predicciones aciertan con la realidad (${b.n}).`) : '';

function renderIni() {
  const due = personasDue(), prs = proyectosActivos(), prox = planesProximos(), cerrar = planesSinCerrar();
  const n = iniciativasSemana(), meta = state.metaSemanal, rows = [];
  for (const pl of cerrar.slice(0, 1)) rows.push(`<button class="row" data-plan="${esc(pl.id)}"><span class="dot" style="--c:var(--amber)"></span>
    <span class="t"><div>¿Se hizo «${esc(cap(pl.titulo))}»?</div><small>${fmtFecha(pl.fecha)}${pl.con ? ' · con ' + esc(pl.con) : ''}</small></span><span class="tag">Cerrar</span></button>`);
  for (const p of state.personas.filter(p => p.pred?.enviado).slice(0, 1)) rows.push(`<button class="row" data-per="${esc(p.id)}"><span class="dot" style="--c:var(--amber)"></span>
    <span class="t"><div>¿Cómo respondió ${esc(p.nombre)}?</div><small>Compara con lo que predijiste</small></span><span class="tag">Resultado</span></button>`);
  for (const p of due.filter(p => !p.pred?.enviado).slice(0, 2)) rows.push(`<button class="row" data-per="${esc(p.id)}"><span class="dot" style="--c:var(--green)"></span>
    <span class="t"><div>Escríbele a ${esc(p.nombre)}</div><small>Último contacto: ${fmtDias(daysSince(p.ultimo))}</small></span><span class="tag">Contacto</span></button>`);
  for (const pr of prs.slice(0, 2)) {
    const d = daysSince(ultimoPaso(pr));
    rows.push(`<button class="row" data-pro="${esc(pr.id)}"><span class="dot" style="--c:var(--accent)"></span>
      <span class="t"><div>${esc(pr.paso || 'Define el siguiente paso')}</div><small>${esc(pr.nombre)}${pr.cuando ? ` · ${fmtFecha(pr.cuando)}${pr.hora ? ' ' + fmtHora(pr.hora) : ''}` : ''}${d >= 7 ? ` · <span class="amber">sin avanzar ${fmtDias(d)}</span>` : ''}</small></span><span class="tag">Proyecto</span></button>`);
  }
  for (const pl of prox.slice(0, 2)) rows.push(`<button class="row" data-plan="${esc(pl.id)}"><span class="dot" style="--c:var(--muted)"></span>
    <span class="t"><div>${esc(cap(pl.titulo))}${pl.con ? ' con ' + esc(pl.con) : ''}</div><small>${fmtFecha(pl.fecha)} · ${fmtHora(pl.hora)}</small></span><span class="tag">Plan</span></button>`);
  const hoyD = new Date(), nuevo = (wd(today()) === 0 || hoyD.getDate() === 1) && state.revision !== today();
  const revisionRow = nuevo || wd(today()) === 6 ? `<button class="row" data-man="revision"><span class="dot" style="--c:var(--accent)"></span>
    <span class="t"><div>${nuevo ? 'Nuevo comienzo: revisión semanal' : 'Revisión semanal'}</div><small>10 minutos: logros, siguientes pasos y bloques de la semana</small></span><span class="tag">${hoyD.getDate() === 1 ? 'Mes nuevo' : wd(today()) === 0 ? 'Lunes' : 'Domingo'}</span></button>` : '';
  if (revisionRow) rows.unshift(revisionRow);
  $('#ini').innerHTML = `
    <div class="meter"><span>Iniciativas esta semana</span><b>${n} de ${meta}</b></div>
    <div class="meter-bar"><i style="width:${Math.min(100, n / meta * 100)}%"></i></div>
    ${rows.length ? `<div class="rows">${rows.join('')}</div>` : `<p class="empty">Añade a las personas con las que quieres mantener el contacto y tus proyectos. Aquí aparecerá, cada día, a quién escribir y el siguiente paso de cada proyecto.</p>`}
    <p class="more"><button class="link" data-man="revision">Revisión semanal</button> · <button class="link" data-man="personas">Personas (${state.personas.length})</button> · <button class="link" data-man="proyectos">Proyectos (${prs.length})</button> · <button class="link" data-man="plan">Proponer un plan</button></p>`;
}
$('#ini').addEventListener('click', e => {
  const b = e.target.closest('[data-per],[data-pro],[data-plan],[data-man]'); if (!b) return;
  if (b.dataset.per) personaSheet(state.personas.find(p => p.id === b.dataset.per));
  if (b.dataset.pro) proyectoSheet(state.proyectos.find(p => p.id === b.dataset.pro));
  if (b.dataset.plan) planSheet(state.planes.find(p => p.id === b.dataset.plan));
  if (b.dataset.man === 'personas') personasManager();
  if (b.dataset.man === 'proyectos') proyectosManager();
  if (b.dataset.man === 'plan') planForm();
  if (b.dataset.man === 'revision') revisionSemanal();
});

// Personas
function registrar(p, tipo) {
  const t = today(), repetido = p.historial.some(h => h.d === t && h.tipo === tipo);
  p.ultimo = t;
  if (p.pred && !p.pred.enviado) p.pred.enviado = true;
  if (!repetido) { p.historial.push({ d: t, tipo }); p.historial = p.historial.slice(-30); bump('iniciativas'); }
  save(); renderAll();
}
function personasManager() {
  const list = [...state.personas].sort((a, b) => daysSince(b.ultimo) / b.cada - daysSince(a.ultimo) / a.cada);
  showSheet(`<h2>Personas</h2>
    <p class="sci">Las personas a las que escribes valoran tu mensaje más de lo que crees, sobre todo si es inesperado (Liu et al., 2023). Elige con quién quieres mantener el contacto y en qué círculo está.</p>
    ${sesgo() ? `<p class="meta">${sesgoTxt(sesgo())}</p>` : ''}
    <div class="rows">${list.map(p => `<button class="row" data-p="${esc(p.id)}"><span class="dot" style="--c:${daysSince(p.ultimo) >= p.cada ? 'var(--green)' : 'var(--empty)'}"></span>
      <span class="t"><div>${esc(p.nombre)}</div><small>${CADA[p.cada] || ''} · último contacto ${fmtDias(daysSince(p.ultimo))}</small></span></button>`).join('')}</div>
    ${list.length ? '' : '<p class="empty">Aún no hay nadie.</p>'}
    <div class="actions"><button class="link" id="pm-close">Cerrar</button><button class="primary" id="pm-add">Añadir persona</button></div>`);
  $('#sheet-body').querySelectorAll('[data-p]').forEach(b => b.onclick = () => personaSheet(state.personas.find(p => p.id === b.dataset.p)));
  $('#pm-add').onclick = () => personaForm();
  $('#pm-close').onclick = closeSheet;
}
function personaForm(p = null) {
  showSheet(`<h2>${p ? 'Editar' : 'Añadir'} persona</h2>
    <div class="field"><label>Nombre</label><input id="pf-n" maxlength="40" value="${esc(p?.nombre)}" placeholder="Ana"></div>
    <div class="field"><label>Teléfono con código de país (opcional)</label><input id="pf-t" inputmode="tel" value="${esc(p?.tel)}" placeholder="58 412 1234567"></div>
    <div class="field"><label>Círculo y frecuencia de contacto</label><select id="pf-c">${Object.entries(CADA).map(([k, v]) => `<option value="${k}" ${+k === (p?.cada || 30) ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    <div class="actions">${p ? '<button class="link red" id="pf-del">Eliminar</button>' : ''}<button class="link" id="pf-cancel">Cancelar</button><button class="primary" id="pf-ok">Guardar</button></div>`);
  $('#pf-n').focus();
  $('#pf-cancel').onclick = () => p ? personaSheet(p) : personasManager();

  $('#pf-ok').onclick = () => {

    const data = { nombre, tel: $('#pf-t').value.trim(), cada: +$('#pf-c').value };
    if (p) Object.assign(p, data); else state.personas.push(p = { id: crypto.randomUUID(), ultimo: '', historial: [], ...data });
    save(); renderAll(); personaSheet(p);
  };
}
function personaSheet(p) {
  if (!p) return;
  const tel = p.tel.replace(/\D/g, '');

function planSheet(pl, nuevo = false) {
  if (!pl) return;
  const per = state.personas.find(p => p.nombre.toLowerCase() === (pl.con || '').toLowerCase());
  const tel = per?.tel.replace(/\D/g, '') || '';
  const texto = `Hola${pl.con ? `, ${pl.con}` : ''}. ¿Te animas a ${pl.titulo} el ${fechaLarga(pl.fecha)} a las ${fmtHora(pl.hora)}?`;
  const ini = pl.fecha.replaceAll('-', '') + 'T' + pl.hora.replace(':', '') + '00';
  const finD = new Date(`${pl.fecha}T${pl.hora}`); finD.setHours(finD.getHours() + 1);
  const fin = dayKey(finD).replaceAll('-', '') + 'T' + String(finD.getHours()).padStart(2, '0') + String(finD.getMinutes()).padStart(2, '0') + '00';
  const cal = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(cap(pl.titulo) + (pl.con ? ' con ' + pl.con : ''))}&dates=${ini}/${fin}`;
  const pasado = pl.fecha < today();
  showSheet(`<h2>${esc(cap(pl.titulo))}${pl.con ? ' con ' + esc(pl.con) : ''}</h2>
    <p class="note">${cap(fechaLarga(pl.fecha))} · ${fmtHora(pl.hora)}${nuevo ? '. Ahora, envía la invitación y apártalo en el calendario.' : ''}</p>
    ${pasado ? `<p style="margin:0 0 12px">¿Se hizo?</p><div class="chips"><button class="chip" data-done="si">Sí</button><button class="chip" data-done="no">No, se canceló</button></div>` : `
    <div class="actions stack" style="margin-top:0">
      <a class="primary btn" href="https://wa.me/${tel}?text=${encodeURIComponent(texto)}" target="_blank" rel="noopener">Enviar invitación por WhatsApp</a>
      <a class="outline btn" href="${cal}" target="_blank" rel="noopener">Añadir a Google Calendar</a>
    </div>
    <h3>Para la conversación</h3>
    <ul class="pros">${[...PREGUNTAS].sort(() => Math.random() - .5).slice(0, 3).map(q => `<li>${esc(q)}</li>`).join('')}</ul>
    <p class="meta">Pasa pronto de lo superficial a lo profundo: resulta menos incómodo de lo que crees (Kardas et al., 2022). Haz preguntas de seguimiento y, ante una buena noticia, responde con entusiasmo y pregunta más (Gable et al., 2004).</p>`}
    <div class="actions"><button class="link red" id="ps-del">Eliminar</button><button class="link" id="ps-close">Cerrar</button></div>`);
  $('#sheet-body').querySelectorAll('[data-done]').forEach(b => b.onclick = () => {
    pl.hecho = true; pl.resultado = b.dataset.done; save(); renderAll();
    showSheet(b.dataset.done === 'si'
      ? `<h2>Plan cumplido</h2><p class="note">Probablemente le caíste mejor de lo que piensas: después de conversar, casi todos subestimamos cuánto le gustamos a la otra persona (Boothby et al., 2018).</p>
        <div class="actions stack"><button class="primary" id="pd-next">Proponer el siguiente encuentro</button><button class="link" id="pd-close">Cerrar</button></div>`
      : `<h2>Se canceló</h2><p class="note">Pasa. Lo que cuenta es volver a proponerlo, con día y hora.</p>
        <div class="actions stack"><button class="primary" id="pd-next">Proponer otra fecha</button><button class="link" id="pd-close">Cerrar</button></div>`);
    $('#pd-next').onclick = () => planForm(pl.con);
    $('#pd-close').onclick = closeSheet;
  });
  $('#ps-del').onclick = () => { state.planes = state.planes.filter(x => x !== pl); save(); renderAll(); closeSheet(); };
  $('#ps-close').onclick = closeSheet;
}

function pasoHecho(pr) {

// Día, hora y lugar del siguiente paso: el plan «si…, entonces…» con fecha y hora concretas.
function pasoCampos(pr) {
  return `<div class="times"><div class="field"><label>¿Qué día?</label><input id="pp-c" type="date" value="${esc(pr?.cuando)}"></div>
      <div class="field"><label>¿A qué hora?</label><input id="pp-h" type="time" value="${esc(pr?.hora)}"></div></div>
    <div class="field"><label>¿Dónde?</label><input id="pp-d" maxlength="60" value="${esc(pr?.donde)}" placeholder="En mi escritorio"></div>
    <div class="field"><label>Versión de 2 minutos (para los días difíciles)</label><input id="pp-m" maxlength="100" value="${esc(pr?.minima)}" placeholder="Abrir el documento y escribir el título"></div>`;
}
const leerPaso = () => ({ cuando: $('#pp-c').value, hora: $('#pp-h').value, donde: $('#pp-d').value.trim(), minima: $('#pp-m').value.trim() });
function calUrl(texto, fecha, hora, mins, lugar = '') {
  const a = new Date(`${fecha}T${hora}`), b = new Date(a.getTime() + mins * 60000);
  const f = d => dayKey(d).replaceAll('-', '') + 'T' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0') + '00';
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(texto)}&dates=${f(a)}/${f(b)}${lugar ? '&location=' + encodeURIComponent(lugar) : ''}`;
}
// «Estoy procrastinando»: nombrar la emoción, reformular el pensamiento y empezar por 2 minutos (TCC + autocompasión).
const TRABAS = {
  'Miedo a hacerlo mal': 'Cambia «tiene que quedar perfecto» por «solo un borrador feo». Lo feo se corrige; lo que no existe, no.',

  'Cansancio': 'Haz la versión de 2 minutos. Actuar según el plan, no según el ánimo, suele subir la energía al empezar.',

function procrastinando(pr) {

    <div class="actions"><button class="link" id="pc-close">Cerrar</button></div>`);
  $('#pc-close').onclick = () => proyectoSheet(pr);
  $('#sheet-body').querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    showSheet(`<h2>${esc(b.dataset.t)}</h2>
      <p style="margin:0 0 14px">${esc(TRABAS[b.dataset.t])}</p>
      <p class="sci">Las intervenciones basadas en terapia cognitivo-conductual son las que más reducen la procrastinación (Rozental et al., 2018; van Eerde y Klingsieck, 2018).</p>
      <div class="field"><label>Lo más pequeño que puedes hacer ahora</label><input id="pc-min" maxlength="100" value="${esc(pr.minima || pr.paso)}"></div>
      <div class="actions stack"><button class="primary" id="pc-go">Empezar 2 minutos</button><button class="link" id="pc-back">Volver</button></div>`);
    $('#pc-go').onclick = () => { closeSheet(); startFocus($('#pc-min').value.trim() || pr.paso, 2, pr.id); };
    $('#pc-back').onclick = () => procrastinando(pr);
  });
}
// Revisión semanal: logros, proyectos sin siguiente paso y bloques para la semana. Los lunes y el día 1 se ofrece sola.
function revisionSemanal() {
  state.revision = today(); save();
  const ks = Array.from({ length: 7 }, (_, i) => dayKey(addDays(new Date(), i - 6)));
  const sum = f => ks.reduce((a, k) => a + dayOf(k)[f], 0);
  const victorias = state.proyectos.flatMap(p => p.pasos.filter(x => ks.includes(x.d)).map(x => ({ ...x, p: p.nombre })));
  const prs = proyectosActivos(), sinPaso = prs.filter(p => !p.paso), sinFecha = prs.filter(p => p.paso && !p.cuando);
  const reporte = `Mi semana: ${fmtMin(sum('enfoque'))} de enfoque, ${sum('iniciativas')} iniciativas, ${victorias.length} pasos en proyectos${victorias.length ? ` (${victorias.slice(-3).map(v => v.t).join('; ')})` : ''}. Esta semana me comprometo a: ${prs.filter(p => p.paso).slice(0, 3).map(p => p.paso).join('; ') || '…'}.`;
  showSheet(`<h2>Revisión semanal</h2>
    <p class="note">Los comienzos (un lunes, un mes nuevo) son buen momento para retomar metas (Dai et al., 2014). Diez minutos bastan.</p>
    <h3 style="margin-top:8px">1. Lo que lograste</h3>
    <p class="meta">${fmtMin(sum('enfoque'))} de enfoque · ${sum('iniciativas')} iniciativas · ${victorias.length} pasos · resististe ${sum('resistidas') + sum('alternativas')} veces</p>
    ${victorias.length ? `<ul class="pros">${victorias.slice(-6).map(v => `<li>${esc(v.t)} <span class="meta">· ${esc(v.p)}</span></li>`).join('')}</ul>` : ''}
    <h3>2. Siguientes pasos</h3>
    ${sinPaso.length || sinFecha.length ? `<div class="rows">${[...sinPaso, ...sinFecha].map(p => `<button class="row" data-p="${esc(p.id)}"><span class="dot" style="--c:var(--amber)"></span><span class="t"><div>${esc(p.nombre)}</div><small>${p.paso ? 'Ponle día y hora' : 'Sin siguiente paso'}</small></span></button>`).join('')}</div>` : '<p class="meta">Cada proyecto tiene paso con día y hora.</p>'}
    <h3>3. Personas</h3>
    <p class="meta">${personasDue().length ? `Te toca escribir a ${personasDue().slice(0, 4).map(p => esc(p.nombre)).join(', ')}.` : 'Estás al día con tus círculos.'} Meta: ${state.metaSemanal} iniciativas esta semana.</p>
    <h3>4. Compártelo</h3>
    <p class="meta">Hacer público el progreso aumenta su efecto (Harkin et al., 2016).</p>
    <div class="actions stack"><a class="outline btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(reporte)}">Enviar mi reporte por WhatsApp</a><button class="primary" id="rv-ok">Listo</button></div>`);
  $('#sheet-body').querySelectorAll('[data-p]').forEach(b => b.onclick = () => proyectoForm(state.proyectos.find(p => p.id === b.dataset.p)));
  $('#rv-ok').onclick = () => { closeSheet(); renderAll(); };
}

// ---------- Lo que pasa al salir y volver a la app
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') {
    if (state.sesion && !state.sesion.fuera) { state.sesion.fuera = Date.now(); save(); }
    if (state.salida) salidaOculta = true;
    return;
  }
  // De vuelta.
  renderAll(); htRefresh();
  if (gate && !gate.listo) { gate.fin = Date.now() + gate.total * 1000; paintGate(); toast('La espera vuelve a empezar.'); }
  const s = state.sesion;
  if (s) {
    if (focusLeft() <= 0) finishFocus(true);
    else if (s.fuera) {
      s.ints++; s.fuera = 0; save(); paintFocus(); buzz(40);
      toast(`Tomaste el teléfono a los ${fmtMin((Date.now() - s.inicio) / 60000)}. Bloquéalo y sigue.`);
    }
  }
  checkSalida();
});

// ---------- Ajustes
function settings() {
  const ht = htData();
  const htLine = htRemote ? `Conectado a la cuenta ${esc(htEmail)}` : ht ? 'Leyendo los datos de este teléfono' : 'No encontrado en este teléfono';
  showSheet(`<h2>Ajustes</h2>
    <div class="field" style="margin-top:14px"><label>Nombre</label><input id="s-name" maxlength="30" value="${esc(state.nombre)}" placeholder="${esc(htData()?.nombre || '¿Cómo te llamas?')}"></div>
    <div class="set-row"><span>Aperturas al día<small>Después, hay que escribir una frase</small></span>
      <select id="s-lim">${Array.from({ length: 10 }, (_, i) => i + 1).map(n => `<option ${n === state.limite ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <div class="set-row"><span>Espera inicial<small>Se duplica con cada apertura del día</small></span>
      <select id="s-wait">${[5, 10, 20, 30].map(n => `<option value="${n}" ${n === state.espera ? 'selected' : ''}>${n} s</option>`).join('')}</select></div>
    <div class="set-row"><span>Presupuesto de distracción<small>Unos 30 min al día reducen el FOMO (Hunt et al., 2018)</small></span>
      <select id="s-bud">${[15, 30, 45, 60].map(n => `<option value="${n}" ${n === state.presupuesto ? 'selected' : ''}>${n} min</option>`).join('')}</select></div>
    <div class="set-row"><span>Meta de iniciativas<small>Contactos, planes y pasos de proyecto por semana</small></span>
      <select id="s-meta">${Array.from({ length: 14 }, (_, i) => i + 1).map(n => `<option ${n === state.metaSemanal ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
    <h3>Ventanas de revisión</h3>
    <p class="meta">Revisar por lotes tres veces al día mejora la atención y baja el estrés (Fitz et al., 2019). Fuera de estas horas, la espera es el doble.</p>
    <div class="times" style="grid-template-columns:1fr 1fr 1fr">${[0, 1, 2].map(i => `<div class="field"><label>${['Primera', 'Segunda', 'Tercera'][i]}</label><input id="s-v${i + 1}" type="time" value="${state.ventanas[i] || ''}"></div>`).join('')}</div>
    <div class="set-row"><span>Duración de cada ventana</span>
      <select id="s-vmin">${[10, 15, 20, 30].map(n => `<option value="${n}" ${n === state.ventanaMin ? 'selected' : ''}>${n} min</option>`).join('')}</select></div>
    <h3>Apps que te distraen</h3>
    <div id="s-apps">${state.apps.map(a => `<div class="app-row"><span class="t">${esc(a.nombre)}<small>${esc(a.url)}</small></span><button class="x" data-del="${esc(a.id)}" aria-label="Quitar">×</button></div>`).join('')}</div>
    <div class="add-app"><input id="s-an" placeholder="Nombre"><input id="s-au" placeholder="https://…" inputmode="url"><button class="link" id="s-add">Añadir</button></div>
    <p class="meta" style="margin-top:10px">En Android, la dirección web abre la app si la tienes instalada.</p>
    <h3>Alternativas</h3>
    <div class="field"><textarea id="s-alts">${esc(state.alternativas.join('\n'))}</textarea><p class="meta" style="margin-top:6px">Una por línea.</p></div>
    <h3>Habit Tracker</h3>
    <div class="set-row"><span>${htLine}<small>Tus hábitos y tareas se leen, nunca se cambian desde aquí</small></span><a class="link" href="${HT_URL}" target="_blank" rel="noopener">Abrir</a></div>
    <h3>Datos</h3>
    <div class="set-row"><span>Guardar copia<small>Archivo .json con tu historial y ajustes</small></span><button class="link" id="s-exp">Guardar</button></div>
    <div class="set-row"><span>Restaurar copia</span><button class="link" id="s-imp">Elegir archivo</button></div>
    ${installEvt ? `<div class="set-row"><span>Instalar en el teléfono</span><button class="link" id="s-inst">Instalar</button></div>` : ''}
    <div class="set-row"><span>Configura tu teléfono<small>${CONFIG.filter(c => state.config[c[0]]).length} de ${CONFIG.length} hechos</small></span><button class="link" id="s-conf">Ver</button></div>
    <div class="set-row"><span>Cómo usar Enfoque</span><button class="link" id="s-help">Ver</button></div>
    <div class="set-row"><span>Versión ${APP_VERSION}</span><button class="link" id="s-upd">Buscar actualización</button></div>
    <div class="actions"><button class="primary" id="s-ok">Listo</button></div>`);
  const body = $('#sheet-body');
  body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { state.apps = state.apps.filter(a => a.id !== b.dataset.del); save(); b.closest('.app-row').remove(); });
  $('#s-add').onclick = () => {
    const n = $('#s-an').value.trim(); let u = $('#s-au').value.trim();
    if (!n || !u) { (n ? $('#s-au') : $('#s-an')).focus(); return; }
    if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = 'https://' + u;
    state.apps.push({ id: crypto.randomUUID(), nombre: n, url: u }); save(); settings();
  };
  $('#s-exp').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `enfoque-${today()}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
  $('#s-imp').onclick = () => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = async () => {
      try { const s = JSON.parse(await inp.files[0].text()); if (!s || typeof s !== 'object' || !s.dias) throw 0; state = normalize(s); save(); renderAll(); closeSheet(); toast('Copia restaurada.'); }
      catch { toast('Ese archivo no es una copia de Enfoque.'); }
    };
    inp.click();
  };
  $('#s-inst')?.addEventListener('click', async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; closeSheet(); });
  $('#s-help').onclick = welcome;
  $('#s-conf').onclick = configSheet;
  $('#s-upd').onclick = async () => {
    const reg = await navigator.serviceWorker?.getRegistration();
    if (!reg) { toast('Sin conexión con el servidor.'); return; }
    await reg.update().catch(() => {});
    if (!reg.installing && !reg.waiting) toast(`Tienes la última versión (${APP_VERSION}).`);
  };
  $('#s-ok').onclick = () => {
    state.nombre = $('#s-name').value.trim().split(/\s+/)[0] || '';
    state.limite = +$('#s-lim').value; state.espera = +$('#s-wait').value;
    state.presupuesto = +$('#s-bud').value; state.metaSemanal = +$('#s-meta').value; state.ventanaMin = +$('#s-vmin').value;
    const vs = [$('#s-v1').value, $('#s-v2').value, $('#s-v3').value].filter(Boolean); if (vs.length) state.ventanas = vs;
    const alts = $('#s-alts').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (alts.length) state.alternativas = alts;
    save(); closeSheet(); renderAll();
  };
}
$('#open-settings').onclick = settings;

// ---------- Bienvenida: el desincentivo de verdad es que las apps ya no estén a un toque.
function welcome() {
  showSheet(`<h2>Menos teléfono, más de lo que importa</h2>
    <p class="note">Enfoque se pone entre tú y las apps que te roban tiempo. Tres pasos, una sola vez:</p>
    <ol class="pros" style="padding-left:20px">
      <li style="margin-bottom:8px"><b>Instala Enfoque</b> en la pantalla de inicio (Chrome → ⋮ → «Instalar aplicación»).</li>
      <li style="margin-bottom:8px"><b>Quita Instagram, TikTok y demás de la pantalla de inicio</b>: mantén pulsado el icono → «Quitar» (no desinstalar). Siguen en el cajón de apps, pero ya no a un toque.</li>
      <li><b>Pon Enfoque en su lugar.</b> Cuando el pulgar vaya solo a ese rincón, abrirás esta pregunta en vez del feed.</li>
    </ol>
    <p class="note">Después, añade a las personas con las que quieres mantener el contacto y tus proyectos en «Tomar la iniciativa»: cada día verás a quién escribir y el siguiente paso.</p>
    <p class="note">Para un tope estricto, combínalo con Bienestar digital de Android: Ajustes → Bienestar digital → Temporizadores de apps.</p>
    ${state.bienvenida ? '' : `<div class="field"><label>¿Cómo te llamas?</label><input id="w-name" maxlength="30" value="${esc(nombre())}" placeholder="Nombre"></div>`}
    <div class="actions"><button class="link" id="w-conf">Configurar el teléfono</button><button class="primary" id="w-go">Empezar</button></div>`);
  $('#w-conf').onclick = () => { state.bienvenida = true; const n = $('#w-name')?.value.trim().split(/\s+/)[0]; if (n) state.nombre = n; save(); renderAll(); configSheet(); };
  $('#w-go').onclick = () => {
    const n = $('#w-name')?.value.trim().split(/\s+/)[0];
    if (n !== undefined) state.nombre = n || state.nombre;
    state.bienvenida = true; save(); closeSheet(); renderAll();
  };
}

// ---------- Instalación y versiones
let installEvt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').then(reg => {
    const offer = w => { $('#update').hidden = false; $('#update-go').onclick = () => w.postMessage('SKIP_WAITING'); };
    if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      w?.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
    });
  }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloading) { reloading = true; location.reload(); } });
}

// ---------- Arranque
$('#ver').textContent = 'v' + APP_VERSION;
renderAll();
if (state.sesion) { if (focusLeft() <= 0) finishFocus(true); else { if (state.sesion.fuera) { state.sesion.ints++; state.sesion.fuera = 0; save(); } showFocus(); } }
else if (state.salida) checkSalida(true);
else if (!state.bienvenida) welcome();
htRefresh();
// Si el Habit Tracker cambia en otra pestaña de este teléfono, se ve al momento.
addEventListener('storage', e => { if (e.key === HT_KEY) renderPend(); });
// Al cambiar de día, todo vuelve a cero.
let lastDay = today();
setInterval(() => { if (today() !== lastDay) { lastDay = today(); renderAll(); } }, 60000);
</script>
